<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>探究ノート｜明星 高2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --board:#102A22; --board-2:#1C4034; --chalk:#F4F1E8; --chalk-2:#C4D3CB;
  --desk:#E9ECE6; --paper:#FFFEFA; --rule:#DAE3EA; --rule-2:#C3D1DC;
  --pencil:#26302C; --pencil-2:#56615C; --pencil-3:#8C9691;
  --marker:#F28A1E; --marker-dk:#A94E07; --marker-tint:#FDEBD6;
  --redpen:#BE3528; --redpen-tint:#FBEDEA;
  --sb:#2F5D8A; --hc:#94476F; --st:#2A7564;
  --kaimei:#A2476F; --kaimei-tint:#F7E8F0; --kaiketsu:#2A7FA8; --kaiketsu-tint:#E2F1F8;
  --l0:#8C9691; --l1:#B07E1E; --l2:#2A7564; --l3:#102A22;
  --line:#E1E4DE; --line-2:#C9CEC6;
  --ui:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --hand:"Klee One","BIZ UDPGothic","Hiragino Kaku Gothic ProN",sans-serif;
  --lh:2.6rem;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--pencil);font-family:var(--ui);font-size:16px;line-height:1.75}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
h1,h2,h3{line-height:1.4;margin:0}
p{margin:0}
.hand{font-family:var(--hand)}
.fine{font-size:.85rem;color:var(--pencil-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.label{font-size:.85rem;color:var(--pencil-2);display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
.lead{color:var(--pencil-2);margin-bottom:1rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.row.end{justify-content:flex-end}
.h3{font-size:.95rem;color:var(--pencil-2);margin:1.3rem 0 .5rem}

/* ---------- buttons / chips ---------- */
.btn{appearance:none;border:0;border-radius:10px;padding:.72rem 1.1rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:44px;text-decoration:none}
.btn.primary{background:var(--marker);color:var(--board)}
.btn.primary:hover{background:#E67D10}
.btn.dark{background:var(--board);color:var(--chalk)}
.btn.ghost{background:transparent;border:1.5px solid var(--line-2);color:var(--pencil)}
.btn.ghost:hover{border-color:var(--pencil-3)}
.btn.chalk{background:transparent;border:1.5px solid rgba(244,241,232,.45);color:var(--chalk)}
.btn.chalk:hover{border-color:var(--chalk)}
.btn.small{min-height:36px;padding:.4rem .8rem;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:var(--marker-dk);text-decoration:underline;text-underline-offset:3px;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{display:inline-flex;align-items:center;border:1.5px solid var(--line-2);border-radius:999px;padding:.35rem .8rem;background:#fff;font-size:.9rem;min-height:36px;cursor:pointer;user-select:none}
.chip[aria-pressed="true"],.chip:has(input:checked){background:var(--board);border-color:var(--board);color:var(--chalk)}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip:has(input:focus-visible){outline:3px solid var(--marker);outline-offset:2px}
.toggle{border:1.5px solid var(--marker);background:#fff;color:var(--marker-dk);border-radius:999px;padding:.3rem .8rem;font-size:.85rem;font-weight:700;min-height:36px}
.toggle[aria-pressed="true"]{background:var(--marker);color:var(--board)}
.cat{display:inline-flex;align-items:center;gap:.35rem;font-size:.82rem;font-weight:700;color:var(--c)}
.cat::before{content:"";width:.6rem;height:.6rem;border-radius:50%;background:var(--c)}

/* ---------- forms ---------- */
textarea,input[type=text],input[type=number],input[type=password],input[type=search],select{width:100%;border:1.5px solid var(--line-2);border-radius:10px;padding:.6rem .75rem;background:#fff;font-size:16px}
textarea{resize:vertical;line-height:1.7}
textarea.hand{font-family:var(--hand);font-size:1.1rem}
.field{display:grid;gap:.3rem;margin:0 0 1rem;border:0;padding:0}
.field>span,.field legend{font-size:.88rem;font-weight:700;color:var(--pencil-2);padding:0;margin-bottom:.3rem}
.cb{display:flex;gap:.55rem;align-items:flex-start;padding:.3rem 0;cursor:pointer}
.cb input{width:1.2rem;height:1.2rem;margin-top:.25rem;accent-color:var(--board);flex:none}

/* ---------- 黒板（いまの問い・いまやること） ---------- */
.hero{background:var(--board);color:var(--chalk);padding-top:env(safe-area-inset-top)}
.hero-in{max-width:1180px;margin:0 auto;padding:.75rem 1.1rem 1.4rem}
.topline{display:flex;align-items:center;gap:1rem;font-size:.9rem}
.topline .brand{font-weight:700;letter-spacing:.06em}
.topline .who{margin-left:auto;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topline .link{color:var(--chalk);white-space:nowrap}
.mail{display:inline-flex;align-items:center;gap:.3rem;background:var(--redpen);color:#fff;border:0;border-radius:999px;padding:.1rem .6rem;font-size:.8rem;font-weight:700}
.qlabel{color:var(--chalk-2);font-size:.85rem;margin-top:1.2rem;display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.qtext{font-family:var(--hand);font-weight:600;font-size:clamp(1.35rem,4.2vw,2.05rem);line-height:1.6;margin:.35rem 0 1rem;overflow-wrap:anywhere;max-width:44em}
.qtext.empty{color:var(--chalk-2);font-weight:400;font-size:1.2rem}
.fresh{animation:fresh 1s ease-out both}
@keyframes fresh{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.hero .cat{color:var(--chalk)}
.hero .demo{background:rgba(242,138,30,.14);color:#F6C38E}
.todo{margin-top:1.2rem;border-top:1px dashed rgba(244,241,232,.3);padding-top:1rem;display:grid;gap:.6rem}
.todo-h{font-size:.85rem;color:var(--chalk-2)}
.todo-main{display:flex;gap:.8rem 1rem;align-items:center;flex-wrap:wrap}
.todo-main .t{font-size:1.12rem;font-weight:700;flex:1 1 18rem}
.todo-main .t small{display:block;font-weight:400;font-size:.86rem;color:var(--chalk-2);margin-top:.15rem;line-height:1.6}
.due{display:inline-flex;align-items:baseline;gap:.35rem;background:rgba(242,138,30,.15);color:#FFD1A1;border-radius:8px;padding:.2rem .6rem;font-size:.82rem;white-space:nowrap}
.due b{font-size:1.1rem;color:var(--marker)}
.due.late b{color:#FF8E7F}
.todo-sub{display:flex;gap:.4rem .8rem;align-items:center;flex-wrap:wrap;font-size:.9rem;color:var(--chalk-2)}
.todo-sub .link{color:var(--chalk)}

/* ---------- 1画面のレイアウト ---------- */
.home{max-width:1180px;margin:0 auto;padding:1rem 1rem 5rem;display:grid;gap:1rem;align-items:start}
.col{display:grid;gap:1rem;min-width:0}
@media (min-width:980px){.home{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
.card{background:var(--paper);border-radius:14px;padding:1.1rem 1.15rem 1.25rem;border:1px solid var(--line);scroll-margin-top:1rem;min-width:0}
.card>h2,.card>summary h2{font-size:1.08rem}
.card>h2{margin-bottom:.75rem;display:flex;align-items:baseline;gap:.4rem .7rem;flex-wrap:wrap}
.card>h2 .fine{font-weight:400}
details.card>summary{list-style:none;cursor:pointer;display:flex;gap:.4rem .8rem;align-items:baseline;flex-wrap:wrap}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"ひらく";margin-left:auto;font-size:.8rem;color:var(--marker-dk);text-decoration:underline}
details.card[open]>summary::after{content:"とじる"}
details.card[open]>summary{margin-bottom:.9rem}
.demo{background:var(--marker-tint);color:var(--marker-dk);border-radius:10px;padding:.6rem .8rem;font-size:.85rem;margin-top:.8rem}

/* ---------- 問いの洗練（ファネルと指標） ---------- */
.refine{display:grid;gap:1.1rem}
#sec-refine,.drawer .sec{container-type:inline-size}
@container (min-width:700px){.refine{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}}
.funnel{max-width:560px}
.funnel svg{width:100%;height:auto;display:block;overflow:visible}
.funnel .fcap{font-family:var(--hand);font-size:1.02rem;line-height:1.7;margin-top:.3rem;overflow-wrap:anywhere}
.funnel .fcap .fine{font-family:var(--ui)}
.fz{fill:none;stroke:var(--line-2);stroke-width:1;stroke-dasharray:3 4}
.fzt{font-size:10.5px;fill:var(--pencil-2)}
.fzt.b{font-weight:700;fill:var(--pencil)}
.fedge-k{stroke:var(--kaimei);stroke-width:3;stroke-linecap:round}
.fedge-s{stroke:var(--kaiketsu);stroke-width:3;stroke-linecap:round}
.fbox{fill:#fff;stroke-width:2}
.fbox.k{stroke:var(--kaimei)} .fbox.s{stroke:var(--kaiketsu)}
.ft{font-size:12.5px;font-weight:700;text-anchor:middle}
.ft.k{fill:var(--kaimei)} .ft.s{fill:var(--kaiketsu)}
.fts{font-size:9.5px;text-anchor:middle;fill:var(--pencil-2)}
.fseed{fill:var(--paper);stroke:var(--redpen);stroke-width:2}
.fseedt{font-size:11.5px;font-weight:700;text-anchor:middle;fill:var(--pencil)}
.fpath{fill:none;stroke:var(--pencil-2);stroke-width:1.6;stroke-dasharray:4 3}
.fdot circle{fill:#fff;stroke:var(--pencil-2);stroke-width:2}
.fdot text{font-size:10.5px;font-weight:700;text-anchor:middle;dominant-baseline:central;fill:var(--pencil)}
.fdot.cur circle{fill:var(--marker);stroke:var(--board)}
.fdot.sel circle{stroke:var(--board);stroke-width:3}
.fdot{cursor:pointer}
.fdot:focus-visible circle{stroke:var(--marker);stroke-width:4}
.fmini circle{fill:var(--board);fill-opacity:.55;stroke:#fff;stroke-width:1;cursor:pointer}
.fmini circle:hover{fill:var(--marker);fill-opacity:1}
.meters{display:grid;gap:.55rem}
.meter{display:grid;grid-template-columns:5.2rem 1fr 4.6rem;gap:.6rem;align-items:center;font-size:.88rem}
.meter .cells{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.meter .cells i{height:11px;border-radius:3px;background:var(--rule)}
.meter .cells i.on{background:var(--board)}
.meter .st{font-size:.78rem;color:var(--pencil-2);text-align:right}
.meter.weak span:first-child{color:var(--marker-dk);font-weight:700}
.lv{display:inline-flex;align-items:center;gap:.3rem;border-radius:999px;padding:.05rem .65rem;font-size:.8rem;font-weight:700;color:#fff;background:var(--l0);white-space:nowrap}
.lv.l1{background:var(--l1)} .lv.l2{background:var(--l2)} .lv.l3{background:var(--l3);color:var(--marker)}
.hero .lv.l3{background:var(--marker);color:var(--board)}
.dirline{font-size:.85rem;color:var(--pencil-2)}
.dirline b.k{color:var(--kaimei)} .dirline b.s{color:var(--kaiketsu)}
.nexttip{background:var(--marker-tint);border-radius:10px;padding:.7rem .85rem;font-size:.92rem;line-height:1.7}
.nexttip b{color:var(--marker-dk)}
.nexttip .ex{display:block;font-family:var(--hand);font-size:.98rem;margin-top:.2rem}
.live{border:1.5px dashed var(--line-2);border-radius:12px;padding:.75rem .85rem;margin:-.3rem 0 1rem;display:grid;gap:.5rem}
.live .meter{grid-template-columns:4.8rem 1fr 4.4rem;font-size:.82rem}

/* 問いの更新の記録 */
.lineage{list-style:none;margin:0;padding:0 0 0 1.6rem;position:relative}
.lineage::before{content:"";position:absolute;left:.5rem;top:.9rem;bottom:1.4rem;width:2px;background:var(--rule-2)}
.lv-i{position:relative;padding:.35rem 0 1.1rem}
.lv-i::before{content:"";position:absolute;left:-1.42rem;top:.8rem;width:.85rem;height:.85rem;border-radius:50%;background:var(--paper);border:2px solid var(--pencil-3)}
.lv-i.current::before{background:var(--marker);border-color:var(--marker)}
.lv-q{font-family:var(--hand);font-size:1.1rem;line-height:1.8;overflow-wrap:anywhere}
.lv-i.past .lv-q{color:var(--pencil-2);text-decoration:line-through;text-decoration-color:var(--pencil-3);text-decoration-thickness:1.5px}
mark.add{background:linear-gradient(transparent 55%,rgba(242,138,30,.38) 55%);color:inherit;padding:0 1px}
.lv-meta{font-size:.8rem;color:var(--pencil-3);margin-top:.15rem;display:flex;flex-wrap:wrap;gap:.25rem .7rem;align-items:center}
.trig{display:inline-block;border:1px solid var(--line-2);border-radius:999px;padding:0 .5rem;color:var(--pencil-2);background:#fff}
.lv-note{font-size:.88rem;color:var(--pencil-2);margin-top:.25rem;padding-left:.7rem;border-left:2px solid var(--rule)}
.tallies{display:inline-flex;gap:3px;vertical-align:middle}
.tally{width:22px;height:22px;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;fill:none}

/* ---------- いまの段階 ---------- */
.stages{list-style:none;margin:0 0 1rem;padding:0;display:grid;grid-template-columns:repeat(4,1fr)}
.stage{position:relative}
.stage::before{content:"";position:absolute;top:1.15rem;left:-50%;width:100%;height:3px;background:var(--rule-2);z-index:0}
.stage:first-child::before{display:none}
.stage.done::before,.stage.now::before{background:var(--board)}
.stage button{position:relative;z-index:1;width:100%;background:none;border:0;padding:0 .15rem;display:grid;justify-items:center;gap:.2rem;text-align:center;font-size:.82rem;line-height:1.35;word-break:keep-all}
.stage .no{width:2.3rem;height:2.3rem;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid var(--rule-2);font-weight:700;color:var(--pencil-3)}
.stage.done .no{background:var(--board);border-color:var(--board);color:var(--chalk)}
.stage.now .no{background:var(--marker);border-color:var(--board);color:var(--board);box-shadow:0 0 0 4px var(--marker-tint)}
.stage.now .nm{font-weight:700}
.stage .dd{font-size:.72rem;color:var(--pencil-3)}
.tasks{display:grid}
.task{display:grid;grid-template-columns:1.6rem 1fr auto;gap:.2rem .5rem;align-items:start;padding:.6rem 0;border-top:1px solid var(--rule)}
.task .ck{width:1.3rem;height:1.3rem;border-radius:50%;border:2px solid var(--line-2);margin-top:.2rem;display:grid;place-items:center;font-size:.75rem;color:#fff}
.task.ok .ck{background:var(--st);border-color:var(--st)}
.task.info .ck{border-style:dashed}
.task.ok .tl{color:var(--pencil-2)}
.task .tl{font-weight:700;font-size:.95rem}
.task .how{grid-column:2;font-size:.84rem;color:var(--pencil-2)}
.task .btn{grid-row:1/3;grid-column:3;align-self:center}
.loop{display:flex;align-items:center;gap:.4rem;font-size:.85rem;color:var(--marker-dk);margin-top:.7rem}
.loop svg{width:18px;height:18px;flex:none}
.nextstep{display:grid;gap:.3rem;margin-top:.8rem}
.nextstep input{max-width:100%}

/* ---------- この問いにおすすめ ---------- */
.kw{display:inline-block;background:#fff;border:1px solid var(--line-2);border-radius:6px;padding:0 .45rem;margin:.1rem .2rem .1rem 0;font-size:.85rem}
.rsec{margin-top:1rem}
.rsec>h3{font-size:.95rem;margin-bottom:.35rem;display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap}
.bk{padding:.65rem 0;border-top:1px solid var(--rule);display:grid;gap:.1rem}
.bk b{font-size:1rem}
.bk .by{font-size:.84rem;color:var(--pencil-2)}
.bk .why{font-size:.86rem}
.bk .because{font-size:.78rem;color:var(--marker-dk);font-weight:700}
.act{padding:.65rem 0;border-top:1px solid var(--rule);display:grid;gap:.2rem}
.act .top{display:flex;gap:.5rem;align-items:flex-start;justify-content:space-between}
.act h4{font-size:.98rem;margin:0}
.act .sub{font-size:.8rem;color:var(--pencil-2)}
.method{padding:.55rem 0;border-top:1px solid var(--rule)}
.method b{font-size:.95rem}
.method p{font-size:.86rem;color:var(--pencil-2)}
.search{display:grid;gap:.5rem;background:#fff;border:1px solid var(--line);border-radius:12px;padding:.75rem}
.sites{display:flex;flex-wrap:wrap;gap:.4rem}

/* ---------- 予定と締切 ---------- */
.sched{list-style:none;margin:0;padding:0}
.sched li{display:grid;grid-template-columns:6.4rem 1fr auto;gap:.2rem .6rem;padding:.6rem 0;border-top:1px solid var(--rule);align-items:baseline;font-size:.92rem}
.sched .d{font-weight:700;font-size:.86rem}
.sched .w small{display:block;font-size:.78rem;color:var(--pencil-2)}
.sched .left{font-size:.8rem;font-weight:700;color:var(--marker-dk);white-space:nowrap}
.sched li.past{color:var(--pencil-3)}
.sched li.past .left{color:var(--pencil-3);font-weight:400}
.sched li.next{background:var(--marker-tint);border-radius:8px;padding-left:.5rem;padding-right:.5rem;border-top-color:transparent}
.sched li.opt:not(.mine) .w{color:var(--pencil-2)}
.tagopt{display:inline-block;font-size:.7rem;border:1px solid var(--line-2);border-radius:4px;padding:0 .3rem;margin-left:.3rem;color:var(--pencil-2);font-weight:400;vertical-align:middle}
.tagopt.mine{border-color:var(--marker);color:var(--marker-dk)}

/* ---------- 先生とのやりとり ---------- */
.askf{display:grid;gap:.6rem}
.thread{margin-top:1rem}
.msg2{border-top:1px solid var(--rule);padding:.8rem 0;position:relative}
.msg2 .m{font-size:.78rem;color:var(--pencil-2);display:flex;gap:.3rem .6rem;flex-wrap:wrap;align-items:center}
.msg2 .mine{margin-top:.25rem;white-space:pre-wrap;overflow-wrap:anywhere}
.msg2 .red{font-family:var(--hand);color:var(--redpen);font-size:1.08rem;line-height:1.85;margin-top:.3rem;white-space:pre-wrap;overflow-wrap:anywhere}
.msg2 .red.auto{color:var(--pencil)}
.msg2 .reply{margin-top:.5rem;padding-left:.8rem;border-left:3px solid var(--redpen-tint)}
.msg2.unread::before{content:"";position:absolute;left:-.8rem;top:1.2rem;width:.45rem;height:.45rem;border-radius:50%;background:var(--redpen)}
.st-wait{color:var(--marker-dk);font-weight:700}
.st-done{color:var(--st);font-weight:700}
.new{font-size:.7rem;background:var(--redpen);color:#fff;border-radius:4px;padding:0 .35rem}

/* ---------- Inspired100 ---------- */
.countdown{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;background:var(--board);color:var(--chalk);border-radius:12px;padding:.9rem 1rem;margin-bottom:1rem}
.countdown .n{font-size:2.2rem;font-weight:700;color:var(--marker);line-height:1}
.progress{height:10px;background:var(--rule);border-radius:999px;overflow:hidden;margin:.4rem 0 .6rem}
.progress i{display:block;height:100%;background:var(--board)}

/* ---------- 過去の受賞問い ---------- */
.pastcheck{border-radius:10px;padding:.7rem .85rem;font-size:.9rem;margin:.2rem 0 1rem;line-height:1.7}
.pastcheck ul{margin:.35rem 0;padding-left:1.1rem}
.pastcheck li{color:var(--pencil)}
.pastcheck.same{background:var(--redpen-tint);color:var(--redpen);border:1.5px solid var(--redpen)}
.pastcheck.near{background:var(--marker-tint);color:var(--marker-dk)}
p.pastcheck.ok{padding:0;color:var(--st);font-size:.85rem}
.past{padding:.7rem 0;border-top:1px solid var(--rule);display:grid;gap:.15rem}
.past .hand{font-size:1.02rem}

/* ---------- ヒント集（別ページ） ---------- */
.guide{max-width:860px;margin:0 auto;padding:1rem 1rem 5rem;display:grid;gap:1rem}
.toc{display:flex;flex-wrap:wrap;gap:.4rem}
.item{padding:.9rem 0;border-top:1px solid var(--rule)}
.item h3{font-size:1rem}
.item .sub{font-size:.85rem;color:var(--pencil-2)}
.seeds{list-style:none;margin:.5rem 0 0;padding:0;display:grid;gap:.35rem}
.seed{display:flex;gap:.6rem;align-items:flex-start;justify-content:space-between}
.seed span{font-family:var(--hand);font-size:1.02rem}
.seed .link{white-space:nowrap;font-size:.82rem}
.facts{display:grid;grid-template-columns:auto 1fr;gap:.1rem .9rem;font-size:.9rem;margin:.5rem 0}
.facts dt{color:var(--pencil-2)}
.facts dd{margin:0}
.ladder{display:grid;gap:.9rem;margin-top:.6rem}
@media (min-width:700px){.ladder{grid-template-columns:1fr 1fr}}
.ladder .lane{border-radius:12px;padding:.8rem .9rem;display:grid;gap:.45rem}
.ladder .lane.k{background:var(--kaimei-tint)} .ladder .lane.s{background:var(--kaiketsu-tint)}
.ladder .lane h3{font-size:.98rem}
.ladder .lane.k h3{color:var(--kaimei)} .ladder .lane.s h3{color:var(--kaiketsu)}

const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const DEMO = !CONFIG.API_URL;
const DAY = 86400000;
const WD = ['日', '月', '火', '水', '木', '金', '土'];
function daysSince(iso) { return iso ? (Date.now() - new Date(iso)) / DAY : 0; }
function dayStart(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function daysLeft(iso) { return Math.round((dayStart(iso) - dayStart(Date.now())) / DAY); }
function md(iso) { if (!iso) return ''; const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()}`; }
function mdw(iso) { if (!iso) return ''; const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()}（${WD[d.getDay()]}）`; }
function rel(iso) { if (!iso) return '—'; const d = Math.floor(daysSince(iso)); return d <= 0 ? '今日' : d === 1 ? '昨日' : `${d}日前`; }
function catOf(id) { return CATS.find(c => c.id === id); }
function catTag(id) { const c = catOf(id); return c ? `<span class="cat" style="--c:${c.color}">${esc(c.id)}</span>` : '<span class="fine">部門 未定</span>'; }

async function api(action, payload = {}) {
  if (DEMO) { await sleep(150); return Demo.handle(action, payload); }
  const body = JSON.stringify(Object.assign({ action }, payload));
  for (let i = 0; i < 3; i++) {
    let data;
    try {
      const res = await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body });
      data = await res.json();
    } catch (e) {
      await sleep(900 * (i + 1) + Math.random() * 700);   // 混雑・通信エラーは少し待って再送
      continue;
    }
    if (!data.ok) throw new Error(data.error || 'うまくいきませんでした。');
    return data;
  }
  throw new Error('通信できませんでした。電波のよい場所で、もう一度ためしてください。');
}

const normK = s => String(s || '').normalize('NFKC').toLowerCase().replace(/\s+/g, '').replace(/[\u3041-\u3096]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
const QX = {

const QX_WHEN = /朝|昼|夜|放課後|休み時間|昼休み|授業|試合|練習|テスト|試験|受験|夏|冬|春|秋|季節|最近|昔|戦後|戦争|江戸|明治|大正|昭和|平成|令和|\d+年|年代|時代|とき|場面|前後|毎日|週末|休日|行事|修学旅行|コロナ/;

const QX_SELF = /自分|私|わたし|僕|ぼく|うち(の|ら)|私たち|自分たち|明星|府中|部活|クラス|地元|家族|友だち|友達|先輩|後輩|通学|身近|毎日|いつも/;

const STOPW = new Set(['本当', '関係', '影響', '理由', '方法', '場合', '意味', '必要', '問題', '研究', '変化', '状態', '一番', '以上', '以下', '可能', '大事', '大切', '自分', '自分達', 'どれくらい', 'いつ', '何度', '何人']);
const LOWW = new Set(['府中', '明星', '高校生', '生徒', '学校', '日本', '私達', '人々', '自分たち']);

function tokensOf(q) {
  const t = String(q || '').normalize('NFKC');
  const raw = t.match(/[\p{Script=Han}\p{Script=Katakana}ー々A-Za-z0-9]{2,}/gu) || [];
  const out = [];
  raw.forEach(w => {
    const parts = w.match(/[\p{Script=Katakana}ー]+|[\p{Script=Han}々]+|[A-Za-z0-9]+/gu) || [w];
    const good = parts.filter(p => p.length >= 2);
    if (parts.length > 1 && good.length === parts.length) out.push(...good); else out.push(w);
  });
  return [...new Set(out)].filter(w => !STOPW.has(w));
}

function framesOf(q) {
  const t = String(q || '').normalize('NFKC').replace(/\s+/g, '');
  const f = Object.keys(QX).filter(k => QX[k].test(t));
  return f;
}

/* 問いを分析する。ctx：{ checks:[4つ], why:'気になった理由など', next:'次の一歩' } */
function analyzeQ(q, ctx = {}) {
  const raw = String(q || '').normalize('NFKC').trim();
  const t = raw.replace(/\s+/g, '');
  const te = t.replace(/[。．.!！」』）)]+$/, '');
  const checks = ctx.checks || [];
  const len = [...t].length;
  const fr = framesOf(t);
  const asks = QX_ASK.test(te);
  const theme = !t ? true : (QX_THEME.test(te.replace(/[?？]$/, '')) && !fr.length) || (!fr.length && !asks);
  const explain = fr.filter(k => k !== 'howto');
  const solve = fr.includes('howto');
  const toks = tokensOf(t);
  const has = { who: QX_WHO.test(t), where: QX_WHERE.test(t), when: QX_WHEN.test(t), measure: QX_MEASURE.test(t) || fr.includes('measure'), local: QX_LOCAL.test(t) };
  const broad = QX_BROAD.test(t) && !has.local;
  const multi = (t.match(/[?？]/g) || []).length > 1;

  // 1. 問いの形
  let form = 0;
  if (theme) form = 0;
  else if (!fr.length) form = 0.4;
  else if (fr.some(k => ['why', 'howto', 'really', 'compare', 'condition', 'mechanism'].includes(k))) form = 1;
  else if (fr.includes('meaning')) form = 0.8;
  else form = 0.6;
  // 2. 解像度
  let rp = (has.who ? 1 : 0) + (has.where ? 1 : 0) + (has.when ? 1 : 0) + (has.measure || fr.includes('compare') ? 1 : 0) + (toks.length >= 3 ? 1 : 0) + (has.local ? 0.5 : 0);
  if (len < 12) rp -= 1;
  if (len > 90) rp -= 1;
  if (multi) rp -= 0.5;
  if (broad) rp -= 0.5;
  const res = Math.max(0, Math.min(1, rp / 4.5));
  // 3. 切実さ
  const why = String(ctx.why || '').trim();
  const kk = Math.min(1, (checks[0] ? 0.55 : 0) + (QX_SELF.test(t) ? 0.3 : 0) + (has.local ? 0.15 : 0) + (why.length >= 10 ? 0.2 : 0));
  // 4. 深さ
  let dp = 0;
  if (!theme) {
    const base = { why: 0.6, really: 0.7, compare: 0.6, meaning: 0.6, condition: 0.6, mechanism: 0.6, howto: 0.6, whatif: 0.5, measure: 0.35 };
    dp = fr.length ? Math.max(...fr.map(k => base[k] || 0.4)) : 0.3;
    if (fr.length >= 2) dp += 0.15;
    if (QX_VALUE.test(t)) dp += 0.1;
    if (fr.length === 1 && fr[0] === 'measure') dp -= 0.05;
  }
  const depth = Math.max(0, Math.min(1, dp + (checks[1] ? 0.3 : 0)));
  // 5. 確かめ方
  const next = String(ctx.next || '').trim();
  let vp = (checks[2] ? 0.5 : 0) + (has.measure ? 0.2 : 0) + (has.local ? 0.2 : 0) + (next ? 0.2 : 0) + (fr.some(k => ['really', 'compare', 'measure', 'condition'].includes(k)) ? 0.1 : 0) - (broad ? 0.2 : 0);
  if (theme) vp = Math.min(vp, 0.2);
  const ver = Math.max(0, Math.min(1, vp));

  const ind = { form, kk, res, depth, ver };

/* 変わったところ（前の問いになくて、新しい問いで足されたところ）を見つける */
function diffAdded(prev, cur) {
  const a = [...String(prev || '')], b = [...String(cur || '')];
  const n = a.length, m = b.length;
  if (!n) return [[b.join(''), false]];
  if (n * m > 90000) return [[b.join(''), false]];
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const segs = [];
  const push = (ch, add) => { const l = segs[segs.length - 1]; if (l && l[1] === add) l[0] += ch; else segs.push([ch, add]); };
  let i = 0, j = 0;
  while (j < m) {
    if (i < n && a[i] === b[j]) { push(b[j], false); i++; j++; }
    else if (i < n && dp[i + 1][j] >= dp[i][j + 1]) i++;
    else { push(b[j], true); j++; }
  }
  // 1文字だけ残った「変わっていない」ところは、読みやすさのため前後にくっつける
  for (let k = 1; k < segs.length - 1; k++) if (!segs[k][1] && [...segs[k][0]].length === 1 && segs[k - 1][1] && segs[k + 1][1]) segs[k][1] = true;
  const out = [];
  segs.forEach(s => { const l = out[out.length - 1]; if (l && l[1] === s[1]) l[0] += s[0]; else out.push([s[0], s[1]]); });

}

/* ---------- 過去の受賞問いとの重なりチェック（Code.gs と同じ考え方）---------- */
function normQ(s) {
  let t = String(s || '').normalize('NFKC').toLowerCase();
  t = t.replace(/[\s、。，．,.!?！？「」『』“”"'‘’・…〜~()（）［］\[\]【】:：;；]/g, '');
  t = t.replace(/何故|なんで|どうして/g, 'なぜ').replace(/って/g, 'とは').replace(/なに|なん(?=だ|で)/g, '何').replace(/子ども|こども/g, '子供');
  const ends = ['どうすればよい', 'どうすればいい', 'どうしたらよい', 'どうしたらいい', 'のでしょうか', 'でしょうか', 'のだろうか', 'だろうか', 'のだろう', 'だろう', 'とは何', 'なのか', 'のか', 'なの', 'か', 'の', 'とは'];
  for (let pass = 0; pass < 3; pass++) {
    const e = ends.find(x => t.endsWith(x) && t.length - x.length >= 2);
    if (!e) break;
    t = t.slice(0, -e.length);
  }
  return t;
}
function qGrams(t) { const g = new Set(); if (t.length < 2) { if (t) g.add(t); return g; } for (let i = 0; i < t.length - 1; i++) g.add(t.slice(i, i + 2)); return g; }
function longestRun(a, b) {
  let best = 0;
  for (let i = 0; i < a.length; i++) for (let j = 0; j < b.length; j++) {
    let k = 0; while (i + k < a.length && j + k < b.length && a[i + k] === b[j + k]) k++;
    if (k > best) best = k;
  }
  return best;
}
const PAST = PAST_I100.map(([y, c, p, q]) => { const n = normQ(q); return { y, c, p, q, n, g: qGrams(n) }; });
// level: same（ほぼ同じ・保存できない）/ near（近い・参考）、kind: form（問いの形が近い）/ theme（テーマが同じ）
function pastMatches(q, max = 3) {
  const A = normQ(q);
  if (A.length < 2) return [];
  const ga = qGrams(A);
  const out = [];
  PAST.forEach(p => {
    let dice, cover, run;
    if (A === p.n) { dice = 1; cover = 1; run = A.length; }
    else {
      let n = 0; p.g.forEach(x => { if (ga.has(x)) n++; });
      dice = 2 * n / (ga.size + p.g.size); cover = p.g.size >= 4 ? n / p.g.size : 0; run = longestRun(A, p.n);
    }
    if (dice >= 0.8) out.push({ p, level: 'same', kind: 'form', score: dice });
    else if (dice >= 0.5 || cover >= 0.6) out.push({ p, level: 'near', kind: 'form', score: Math.max(dice, cover * 0.9) });
    else if (run >= 7) out.push({ p, level: 'near', kind: 'theme', score: run / 20 });
  });
  const rank = m => (m.level === 'same' ? 2 : m.kind === 'form' ? 1 : 0);
  return out.sort((a, b) => rank(b) - rank(a) || b.score - a.score).slice(0, max);
}
const pastLabel = p => `${p.y}年・${PAST_CATS[p.c]}`;
function pastCheckHtml(q) {
  const m = pastMatches(q);
  if (!m.length) return q && normQ(q).length >= 2 ? '<p class="pastcheck ok">過去2年の Inspired100 の問いとは重なっていません。</p>' : '';
  const li = m.map(x => `<li><span class="hand">${esc(x.p.q)}</span><span class="fine">（${esc(pastLabel(x.p))}）</span></li>`).join('');
  if (m[0].level === 'same') return `<div class="pastcheck same"><b>過去の Inspired100 の問いと、ほぼ同じです。このままでは保存できません。</b><ul>${li}</ul><p>自分の体験や、場所（府中・明星）、対象、比べる相手を加えて、自分だけの問いにしよう。</p></div>`;
  if (m[0].kind === 'form') return `<div class="pastcheck near"><b>形の近い問いが、過去に選ばれています（参考）。</b><ul>${li}</ul><p>同じにならないように、自分だけの視点をはっきりさせよう。</p></div>`;
  return `<div class="pastcheck near"><b>同じテーマの問いが、過去に選ばれています（参考）。</b><ul>${li}</ul></div>`;
}

    { id: 'lv3', label: '問いを「Lv3 探究になる問い」まで洗練する', how: '切実さと解像度を上げよう。', done: () => curLevel() >= 3, btn: { label: '更新する', act: 'open-update' } },
    { id: 'ask', label: '先生に見てもらう', how: '「先生に相談」から送れます。', done: () => (S.asks || []).length > 0, btn: { label: '相談する', act: 'jump', to: 'sec-teacher' }, needAsk: true },
  ],
  'まとめ・表現': [
    { id: 'items', label: 'Inspired100 の必須項目をそろえる', how: '「Inspired100 応募の準備」でチェックしよう。', done: () => i100Done() === I100_ITEMS.length, btn: { label: 'ひらく', act: 'jump', to: 'sec-i100' } },
    { id: 'read', label: '先生に読んでもらう', how: '「先生に相談」で「応募のこと」を選んで送ろう。', done: () => (S.asks || []).some(a => a.kind === '応募のこと'), btn: { label: '相談する', act: 'jump', to: 'sec-teacher' }, needAsk: true },
    { id: 'send', label: () => `${mdw(CONFIG.INSPIRED100_DEADLINE)} 23:59 までに応募する`, how: '応募したら、担任か探究部の先生に伝えよう。', done: () => false, info: true },
  ],
};
const tasksOf = step => (STEP_TASKS[step] || []).filter(t => !t.needAsk || S.asksOk !== false);
const taskLabel = t => typeof t.label === 'function' ? t.label() : t.label;

function render() {
  if (S.mode === 'teacher') return renderTeacher();
  if (!S.student) return renderLogin();
  $('#app').innerHTML = S.page === 'guide' ? pageGuide() : pageHome();
  S.justUpdated = false;
  if (S.page === 'home') {
    const d = $('#sec-i100');
    if (d) d.addEventListener('toggle', () => { S.openI100 = d.open; });
    watchRead();
  }
}

function renderLogin() {
  const opts = CONFIG.CLASSES.map(c => `<option>${esc(c)}</option>`).join('');
  $('#app').innerHTML = `
    <div class="login"><div class="login-in">
      <p class="kicker">高2・2学期　探究「ラストチャンス」</p>
      <h1>探究ノート</h1>
      <p class="lead">自分の問いを書いて、更新していくノートです。</p>
      <form id="loginForm" autocomplete="on">
        <div class="grid2">
          <label class="field"><span>クラス</span><select name="cls" required><option value="">えらぶ</option>${opts}</select></label>
          <label class="field"><span>番号</span><input name="num" type="number" inputmode="numeric" min="1" max="60" required></label>
        </div>
        <label class="field"><span>名前</span><input name="name" type="text" autocomplete="name" placeholder="例：明星 花子" required></label>
        <button class="btn primary" style="width:100%">ノートをひらく</button>
        <p class="fine" style="margin-top:.8rem">はじめての人は、この3つを入れるとノートができます。次からも同じように入れてください。</p>
      </form>
      ${DEMO ? `<p class="demo">デモモードです（サーバー未設定）。先生用の画面のパスコードは「${esc(CONFIG.DEMO_TEACHER_PASS)}」です。</p>` : ''}
      <div class="foot"><span></span><button type="button" class="link" data-act="teacher-open">先生用の画面</button></div>
    </div></div>`;
}

/* ---------- ホーム（1画面） ---------- */
function pageHome() {
  const A = curA();
  return heroHtml(A) + `<main class="home">
    <div class="col">${refineCard(A)}${stageCard()}${recoCard(A)}</div>
    <div class="col">${scheduleCard()}${teacherCard()}${i100Card()}</div>
  </main>`;
}

function heroHtml(A) {
  const st = S.student, cur = curV(), u = unreadCount();
  return `<header class="hero"><div class="hero-in">
    <div class="topline"><span class="brand">探究ノート</span>
      <span class="who">${esc(st.cls)} ${esc(st.num)}番　${esc(st.name)}</span>
      ${u ? `<button type="button" class="mail" data-act="jump" data-to="sec-teacher">先生から ${u}</button>` : ''}
      <button type="button" class="link" data-act="page" data-page="guide">ヒント集</button>
      <button type="button" class="link" data-act="logout">切りかえ</button></div>
    ${DEMO ? '<p class="demo">デモモードです。書いた内容はこの端末の中だけに保存されます。</p>' : ''}
    <p class="qlabel"><span>いまの問い${cur ? `（${S.versions.length}つめ）` : ''}</span>${A ? lvChip(A.level) : ''}${st.category ? catTag(st.category) : ''}</p>
    <p class="qtext${cur ? '' : ' empty'}${S.justUpdated ? ' fresh' : ''}">${cur ? esc(cur.question) : 'まだ問いがありません。気になっていることを、1行で書いてみよう。'}</p>
    <div class="row"><button type="button" class="btn primary" data-act="open-update">${cur ? '問いを更新する' : '最初の問いを書く'}</button>
      ${S.ai || CONFIG.GEM_URL ? '<button type="button" class="btn chalk" data-act="open-chat">AIと壁打ち</button>' : ''}</div>
    <div id="todoBox">${todoInner(A)}</div>
  </div></header>`;
}

function btnFor(b, cls) {
  if (!b) return '';
  return `<button type="button" class="${cls}" data-act="${b.act}"${b.to ? ` data-to="${b.to}"` : ''}${b.step ? ` data-step="${esc(b.step)}"` : ''}${b.trig ? ` data-trig="${esc(b.trig)}"` : ''}>${esc(b.label)}</button>`;
}
function dueChip(it) {
  const n = daysLeft(it.date);
  return `<span class="due${n < 0 ? ' late' : ''}">${esc(dLabel(it))}${n > 0 ? ` まで あと<b>${n}</b>日` : n === 0 ? ' <b>今日まで</b>' : ` <b>${-n}日すぎ</b>`}</span>`;
}
function nextActions(A) {
  const st = S.student, cur = curV(), out = [];
  let mainTask = null;
  if (!cur) out.push({ title: '最初の問いを書こう', sub: '気になっていることを1行でOK。あとで何度でも書きかえられます。', due: firstDue(), btn: { label: '問いを書く', act: 'open-update' } });
  else {
    const idle = Math.floor(daysSince(cur.at));
    if (idle >= CONFIG.STALE_DAYS) out.push({ title: `問いが${idle}日止まっています`, sub: 'わかったこと・わからなかったことを1行書いて、問いを更新しよう。', btn: { label: '問いを更新する', act: 'open-update' } });
    mainTask = tasksOf(st.step).find(t => !t.done());
    if (mainTask) out.push({ title: taskLabel(mainTask), sub: mainTask.how, due: stepDueItem(st.step), btn: mainTask.btn });
    else {
      const nx = STEPS[STEPS.indexOf(st.step) + 1];
      if (nx) out.push({ title: `「${st.step}」でやることがそろいました`, sub: `次の「${nx}」へ進もう。`, btn: { label: `${nx}へ進む`, act: 'set-step', step: nx } });
    }
    if (A && A.level < 3 && !(mainTask && ['lv', 'lv3'].includes(mainTask.id))) out.push({ title: `問いの次の一手：「${IND.find(i => i.id === A.weakest).label}」を上げる`, btn: { label: '見る', act: 'jump', to: 'sec-refine' } });
  }
  const n = String(pj().next || '').trim();
  if (n && cur) out.push({ title: `自分で決めた次の一歩：${n}` });
  return out;
}
function todoInner(A) {
  const acts = nextActions(A);
  const nd = nextDue();
  if (!acts.length && !nd) return '';
  const [main, ...rest] = acts;
  return `<section class="todo" aria-label="いまやること">
    <p class="todo-h">いまやること</p>
    ${main ? `<div class="todo-main"><p class="t">${esc(main.title)}${main.sub ? `<small>${esc(main.sub)}</small>` : ''}</p>${main.due ? dueChip(main.due) : ''}${btnFor(main.btn, 'btn primary small')}</div>` : ''}
    ${rest.slice(0, 2).map(r => `<div class="todo-sub"><span>・${esc(r.title)}</span>${btnFor(r.btn, 'link')}</div>`).join('')}
    ${nd && !(main && main.due === nd) ? `<div class="todo-sub"><span>次の締切：${esc(nd.title)}</span>${dueChip(nd)}</div>` : ''}
  </section>`;
}

/* 問いの洗練 */
function versionPoints() {
  const vs = S.versions;
  return vs.map((v, i) => { const a = analyzeQ(v.question, ctxOfVersion(v, vs, pj(), i === vs.length - 1)); return { v: v.v, q: v.question, score: a.score, dir: a.dir, level: a.level }; });
}
function metersHtml(A, compact) {
  return `<div class="meters">
    ${compact ? '' : '<p class="label">いまの問いの指標</p>'}
    ${IND.map(k => { const n = cellsOf(A.ind[k.id]); return `<div class="meter${k.id === A.weakest && A.level < 3 ? ' weak' : ''}" title="${esc(k.q)}"><span>${esc(k.label)}</span><span class="cells" role="img" aria-label="${esc(k.label)}：${cellWord(n)}">${[0, 1, 2, 3].map(i => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span><span class="st">${cellWord(n)}</span></div>`; }).join('')}
    <p class="dirline">方向：<b class="${A.dirKey === 'explain' ? 'k' : A.dirKey === 'solve' ? 's' : ''}">${esc(DIR_LABEL[A.dirKey])}</b></p>
  </div>`;
}
function tipHtml(A) {
  if (A.level >= 3) {
    const ext = A.dirKey === 'explain' ? '「どうすれば〜できるか」を考えると、解決したい課題にも広げられます。' : A.dirKey === 'solve' ? '「なぜそうなっているのか」を確かめると、解決策に説得力が出ます。' : '';
    return `<div class="nexttip" style="margin-top:.8rem"><b>${esc(LEVELS[3].name)}</b>：${esc(LEVELS[3].desc)}${ext ? `<span class="ex">${esc(ext)}</span>` : ''}</div>`;
  }
  const k = IND.find(i => i.id === A.weakest);
  return `<div class="nexttip" style="margin-top:.8rem"><b>次の一手（${esc(k.label)}）</b>：${esc(k.tip)}<span class="ex">${esc(k.ex)}</span>${A.warn.map(w => `<span class="fine" style="display:block;margin-top:.3rem">※ ${esc(w)}</span>`).join('')}</div>
    ${S.ai ? '<p style="margin-top:.6rem"><button type="button" class="link" data-act="coach-tip">AIのコーチと、次の一手を考える</button></p>' : ''}`;
}
function refineCard(A) {
  const vs = S.versions, pts = versionPoints();
  const sel = vs.find(v => v.v === S.fsel) || vs[vs.length - 1];
  const selP = sel ? pts.find(p => p.v === sel.v) : null;
  const updates = Math.max(0, vs.length - 1);
  return `<section class="card" id="sec-refine">
    <h2>問いの洗練 <span class="fine">素朴な問いから、探究になる問いへ</span></h2>
    <div class="refine">
      <div class="funnel">${funnelSvg(pts, { sel: sel && sel.v })}
        ${sel ? `<p class="fcap"><span class="fine">${sel.v}つめ・${md(sel.at)}・${esc(LEVELS[selP.level].name)}（点をタップすると切りかわります）</span><br>${esc(sel.question)}</p>` : '<p class="fine" style="margin-top:.4rem">問いを書くと、ここに点が打たれます。更新するたびに、点が上へ動いていきます。</p>'}
      </div>
      <div>${A ? metersHtml(A) + tipHtml(A) : `<p class="lead">問いを書くと、5つの指標（問いの形・切実さ・解像度・深さ・確かめ方）が出ます。</p><p class="fine"><button type="button" class="link" data-act="page" data-page="guide" data-to="g-refine">問いの洗練とは？</button></p>`}</div>
    </div>
    <h3 class="h3">問いの更新の記録 ${vs.length ? `<span class="fine">更新 ${tally(updates)} ${updates}回</span>` : ''}</h3>
    ${lineageHtml(pts)}
  </section>`;
}
function lineageHtml(pts) {
  const vs = S.versions;
  if (!vs.length) return '<p class="fine">まだ記録がありません。</p>';
  const list = vs.map((v, i) => ({ v, prev: vs[i - 1], p: pts[i] })).reverse();
  const shown = S.allLineage ? list : list.slice(0, 3);
  return `<ol class="lineage">${shown.map(({ v, prev, p }, i) => `<li class="lv-i ${i === 0 ? 'current' : 'past'}">
      <div class="lv-q">${prev ? diffHtml(prev.question, v.question) : esc(v.question)}</div>
      <div class="lv-meta"><span>${v.v}つめ・${md(v.at)}</span><span class="trig">${esc(v.trigger)}</span>${lvChip(p.level)}</div>
      ${v.note ? `<p class="lv-note">${esc(v.note)}</p>` : ''}</li>`).join('')}</ol>
    ${list.length > 3 ? `<button type="button" class="link" data-act="toggle-lineage">${S.allLineage ? '新しい3つだけ表示する' : `すべて表示する（${list.length}件）`}</button>` : ''}
    ${vs.length > 1 ? '<p class="fine" style="margin-top:.4rem"><mark class="add">色のついたところ</mark>が、前の問いから変わったところです。</p>' : ''}`;
}

/* いまの段階 */
function taskHtml(t) {
  const ok = !t.info && t.done();
  const b = t.btn && !ok ? btnFor(t.btn, 'btn ghost small') : '';
  return `<div class="task${ok ? ' ok' : ''}${t.info ? ' info' : ''}"><span class="ck" aria-hidden="true">${ok ? '✓' : ''}</span><span class="tl">${esc(taskLabel(t))}<span class="sr">${t.info ? '' : ok ? '（できた）' : '（まだ）'}</span></span>${b}<span class="how">${esc(t.how || '')}</span></div>`;
}
function tasksInner() {
  const st = S.student, tasks = tasksOf(st.step);
  const counted = tasks.filter(t => !t.info);
  return `<p class="label">「${esc(st.step)}」でやること　${counted.filter(t => t.done()).length}/${counted.length}</p><div class="tasks">${tasks.map(taskHtml).join('')}</div>`;
}
function stageCard() {
  const st = S.student, idx = Math.max(0, STEPS.indexOf(st.step));
  return `<section class="card" id="sec-stage">
    <h2>いまの段階 <span class="fine">タップすると切りかえられます</span></h2>
    <ol class="stages">${STEPS.map((s, i) => { const d = stepDueItem(s); return `<li class="stage${i < idx ? ' done' : i === idx ? ' now' : ''}"><button type="button" data-act="set-step" data-step="${esc(s)}" aria-pressed="${i === idx}"><span class="no">${i < idx ? '✓' : i + 1}</span><span class="nm">${esc(s)}</span>${d ? `<span class="dd">${esc(d.dateLabel || md(d.date))}まで</span>` : ''}</button></li>`; }).join('')}</ol>
    <div id="taskBox">${tasksInner()}</div>
    <div class="nextstep"><label class="fine" for="nextInput" style="font-weight:700">自分で決めた次の一歩</label>
      <input id="nextInput" type="text" maxlength="200" data-proj="next" value="${esc(pj().next || '')}" placeholder="例：図書館で本を2冊借りる／部活の1年生5人に話を聞く"></div>
    <p class="loop">${ICONS.loop}問いが更新されたら、また STEP 1 へ。探究とは、問いが更新されること。</p>
  </section>`;
}

/* この問いにおすすめ */

  const st = S.student, R = recoFor(A, st, st.step), it = st.interests || {};
  const bk = x => `<div class="bk"><span class="because">${esc(x.because)}</span><b>『${esc(x.b.title)}』</b><span class="by">${esc(x.b.author)}</span><span class="why">${esc(x.b.why)}</span></div>`;
  return `<section class="card" id="sec-reco">
    <h2>この問いにおすすめ <span class="fine">問いを更新するたびに変わります</span></h2>
    ${A ? `<p class="fine">問いのことば：${A.toks.slice(0, 6).map(w => `<span class="kw">${esc(w)}</span>`).join('') || '—'}</p>` : '<p class="lead">問いを書くと、あなたの問いに合った本・活動・調べ方が出てきます。</p>'}
    <div class="rsec"><h3>本</h3>${R.topic.map(bk).join('')}${bk(R.method)}</div>
    ${R.acts.length ? `<div class="rsec"><h3>学校の機会</h3>${R.acts.map(x => `<div class="act"><span class="because" style="font-size:.78rem;color:var(--marker-dk);font-weight:700">${esc(x.because)}</span>
      <div class="top"><h4>${esc(x.a.name)}</h4><button type="button" class="toggle" data-act="interest" data-id="${x.a.id}" aria-pressed="${!!it[x.a.id]}">${it[x.a.id] ? '気になる ✓' : '気になる'}</button></div>
      <span class="sub">${esc(x.a.group)}　${x.a.facts.map(([k, v]) => `${esc(k)}：${esc(v)}`).join('／')}</span></div>`).join('')}</div>` : ''}
    <div class="rsec"><h3>調べ方</h3>${R.methods.map(m => `<div class="method"><b>${esc(m.t)}</b><p>${esc(m.d)}</p></div>`).join('')}</div>
    <div class="rsec"><h3>自分で探す</h3><div class="search">
      <label class="fine" for="kwInput">探すことば（書きかえてOK）</label>
      <input id="kwInput" type="search" value="${esc(R.words)}" placeholder="例：フェアトレード 高校生" enterkeyhint="search">
      <div class="sites">${SEARCH_SITES.map(s => `<button type="button" class="btn ghost small" data-act="site" data-site="${s.id}">${esc(s.label)}</button>`).join('')}</div>
      <p class="fine">別のタブでひらきます。「近くの図書館の本」は、はじめに地域（府中市など）を選んでください。</p>
    </div></div>
  </section>`;
}

/* 予定と締切 */
function scheduleCard() {
  const it = S.student.interests || {};
  const items = CONFIG.SCHEDULE.slice().sort((a, b) => a.date < b.date ? -1 : 1);
  const nx = nextDue();
  return `<section class="card" id="sec-schedule">
    <h2>予定と締切</h2>
    <ol class="sched">${items.map(x => {
      const n = daysLeft(x.date), past = n < 0, opt = x.who !== 'all', mine = opt && !!it[x.who];
      const tag = opt ? `<span class="tagopt${mine ? ' mine' : ''}">${mine ? '気になる' : '希望者'}</span>` : '';
      return `<li class="${past ? 'past' : ''}${x === nx ? ' next' : ''}${opt ? ' opt' : ''}${mine ? ' mine' : ''}"><span class="d">${esc(dLabel(x))}</span><span class="w">${esc(x.title)}${tag}${x.note ? `<small>${esc(x.note)}</small>` : ''}</span><span class="left">${past ? 'おわり' : n === 0 ? '今日' : `あと${n}日`}</span></li>`;
    }).join('')}</ol>
    <p class="fine" style="margin-top:.5rem">「希望者」の予定は、「気になる」に印をつけると目立つようになります。</p>
  </section>`;
}

/* 先生に相談（相談と、先生からのメッセージをまとめて表示） */
function replyOf(a) { return S.advice.find(x => x.rule === 'ask:' + a.id) || (a.reply ? S.advice.find(x => x.text === a.reply) : null); }
function askItem(a) {
  const rep = replyOf(a), unread = rep && !rep.read;
  const st = a.status === '返事待ち' ? '<span class="st-wait">返事待ち</span>' : a.status === '直接話した' ? '<span class="st-done">先生と直接話しました</span>' : '<span class="st-done">返事あり</span>';
  return `<article class="msg2${unread ? ' unread' : ''}"><p class="m"><span>あなたの相談・${md(a.at)}</span><span>${esc(a.kind)}</span>${st}${unread ? '<span class="new">新着</span>' : ''}</p>
    <p class="mine">${esc(a.text)}</p>
    ${a.reply ? `<div class="reply"><p class="m"><span>${esc(teacherName(a.teacher))}から・${md(a.repliedAt)}</span></p><p class="red">${esc(a.reply)}</p></div>` : ''}</article>`;
}
const teacherName = n => { n = String(n || '先生'); return /先生$|（自動）$/.test(n) ? n : n + '先生'; };
function advItem(x) {
  return `<article class="msg2${x.read ? '' : ' unread'}"><p class="m"><span>${esc(x.kind === '先生' ? teacherName(x.from) : x.from)}から・${md(x.sent || x.created)}</span>${x.read ? '' : '<span class="new">新着</span>'}</p><p class="red${x.kind === '自動' ? ' auto' : ''}">${esc(x.text)}</p></article>`;
}
function teacherCard() {
  const u = unreadCount(), asks = S.asks || [];
  const used = new Set(asks.map(replyOf).filter(Boolean).map(x => x.id));
  const items = asks.map(a => ({ t: (replyOf(a) || {}).sent || a.repliedAt || a.at, html: askItem(a) }))
    .concat(S.advice.filter(x => !used.has(x.id) && !String(x.rule || '').startsWith('ask:')).map(x => ({ t: x.sent || x.created, html: advItem(x) })))
    .sort((a, b) => a.t < b.t ? 1 : -1);
  const form = S.asksOk === false
    ? '<p class="fine">先生への相談は、いま準備中です。直接、担任か探究部の先生に話してください。</p>'
    : `<form id="askForm" class="askf">
      <fieldset class="field" style="margin:0"><legend>何について？</legend><div class="chips">${ASK_KINDS.map((k, i) => `<label class="chip"><input type="radio" name="kind" value="${esc(k)}" ${i === 0 ? 'checked' : ''}><span>${esc(k)}</span></label>`).join('')}</div></fieldset>
      <textarea name="text" rows="3" maxlength="600" required placeholder="例：アンケートをとりたいのですが、どうやってお願いすればいいですか？" aria-label="相談の内容"></textarea>
      <div class="row" style="justify-content:space-between"><span class="fine">担任・探究部の先生が読みます。返事はここに届きます。</span><button class="btn primary small">先生に送る</button></div>
      <p class="fine">急ぐとき・つらいことがあるときは、ここではなく直接先生に話してください。</p>
    </form>`;
  return `<section class="card" id="sec-teacher">

async function submitUpdate(form) {
  const q = fv(form, 'q').trim();
  const cur = curV();
  if (!q) return toast('問いを書いてください。');
  if (cur && q === cur.question) return toast('問いがまだ変わっていません。少しでも書きかえてみよう。');
  const pm = pastMatches(q);
  if (pm.length && pm[0].level === 'same') { $('#pastCheck').innerHTML = pastCheckHtml(q); return toast('過去の Inspired100 の問いとほぼ同じです。自分だけの問いにしてから保存しよう。'); }
  const trigEl = form.querySelector('input[name=trigger]:checked');
  if (cur && !trigEl) return toast('更新のきっかけを選んでください。');
  const before = cur ? curLevel() : -1;
  form.classList.add('busy');
  try {
    const b = await api('student.addVersion', Object.assign(ident(), {
      question: q, trigger: cur ? trigEl.value : 'はじめの問い', note: fv(form, 'note').trim(),
      checks: CHECKS.map((c, i) => fc(form, 'c' + i)),
    }));
    setBundle(b);
    $('#dlg').close(); S.dlg = null;
    S.page = 'home'; S.justUpdated = true; S.fsel = null;
    render();
    window.scrollTo(0, 0);
    const after = curLevel();
    toast(`${cur ? '問いを更新しました' : '最初の問いを書きました'}（${before >= 0 && before !== after ? `Lv${before} → ` : ''}Lv${after}）`);
  } catch (e) { toast(e.message); } finally { form.classList.remove('busy'); }
}

async function sendChat(text) {
  text = String(text || '').trim();
  if (!text || S.chatBusy) return;
  S.chatBusy = true;
  S.chat.push({ role: 'user', text });
  S.chat.push({ role: 'model', text: '考えています…', wait: true });
  if (S.dlg === 'chat') renderChatDlg();
  try {
    const r = await api('student.chat', Object.assign(ident(), { messages: S.chat.filter(m => !m.wait).slice(-12) }));
    S.chat.pop(); S.chat.push({ role: 'model', text: r.reply }); S.aiLeft = r.aiLeft;
  } catch (e) {
    S.chat.pop(); S.chat.pop(); toast(e.message);
  } finally {
    S.chatBusy = false;
    if (S.dlg === 'chat') { renderChatDlg(); const ta = $('#chatForm textarea'); if (ta) ta.focus(); }
  }
}

async function loadAsks(showError) {
  try { const r = await api('student.asks', ident()); S.asks = r.asks || []; S.asksOk = true; }
  catch (e) { if (/不明な操作/.test(e.message)) { S.asksOk = false; S.asks = []; } else if (showError) toast(e.message); }
  refreshTeacherCard();
}
async function refreshAll() {
  try { const b = await api('student.login', S.me); setBundle(b); } catch (e) { toast(e.message); }
  await loadAsks(true);
  toast('最新にしました。');
}
async function submitAsk(f) {
  const text = fv(f, 'text').trim();
  const k = f.querySelector('input[name=kind]:checked');
  if (!text) return toast('相談の内容を書いてください。');
  f.classList.add('busy');
  try {
    const r = await api('student.ask', Object.assign(ident(), { text, kind: k ? k.value : 'その他' }));
    S.asks = r.asks || []; S.asksOk = true;
    refreshTeacherCard();
    toast('先生に送りました。返事はここに届きます。');
  } catch (e) {
    if (/不明な操作/.test(e.message)) { S.asksOk = false; refreshTeacherCard(); toast('先生への相談は、まだ準備中です。'); }
    else { toast(e.message); f.classList.remove('busy'); }
  }
}
let readTimer, readObs;
function markRead() {
  const ids = S.advice.filter(a => !a.read).map(a => a.id);
  if (!ids.length) return;
  clearTimeout(readTimer);
  readTimer = setTimeout(async () => {
    try { await api('student.read', Object.assign(ident(), { ids })); const now = new Date().toISOString(); S.advice.forEach(a => { if (ids.includes(a.id)) a.read = now; }); } catch (e) { /* 次にひらいたとき再送 */ }
  }, 1500);
}
function watchRead() {
  if (readObs) readObs.disconnect();
  const el = $('#sec-teacher');
  if (!el || !unreadCount() || typeof IntersectionObserver === 'undefined') return;
  readObs = new IntersectionObserver(es => { if (es.some(x => x.isIntersecting)) { readObs.disconnect(); markRead(); } }, { threshold: 0.3 });
  readObs.observe(el);
}

async function login(form) {
  const me = { cls: fv(form, 'cls'), num: Number(fv(form, 'num')), name: fv(form, 'name').trim() };
  form.classList.add('busy');
  try {
    const b = await api('student.login', me);
    S.me = me; setBundle(b);
    localStorage.setItem(ME_KEY, JSON.stringify(me));
    S.page = 'home'; S.asks = null; S.asksOk = null;
    render();
    loadAsks(false);
  } catch (e) { toast(e.message); } finally { form.classList.remove('busy'); }
}

const T_PASS = 'tankyu_tpass', T_NAME = 'tankyu_tname';
const FLAG_LABEL = { ask: '相談の返事待ち', noq: '問いがまだない', stale: '止まっている', weak: 'チェックが少ない', past: '受賞問いに近い', draft: 'AI下書きあり' };
const PM_CACHE = new Map();
const pmCached = q => { if (!PM_CACHE.has(q)) PM_CACHE.set(q, pastMatches(q, 2)); return PM_CACHE.get(q); };

async function fetchTeacher(pass) {
  const [d, a] = await Promise.all([
    api('teacher.data', { pass }),
    api('teacher.asks', { pass }).catch(e => ({ asks: null, err: e.message })),
  ]);
  d.asks = a.asks; d.asksErr = a.err || '';
  return d;
}
async function teacherLoad() {
  const pass = sessionStorage.getItem(T_PASS);
  if (!pass) { S.teacher = null; return render(); }
  try { S.teacher = await fetchTeacher(pass); render(); }
  catch (e) { sessionStorage.removeItem(T_PASS); S.teacher = null; render(); toast(e.message); }
}

function tModel() {
  const d = S.teacher;
  const by = (arr, k) => arr.reduce((m, x) => ((m[x[k]] = m[x[k]] || []).push(x), m), {});
  const vBy = by(d.versions, 'key'), aBy = by(d.advice, 'key'), mBy = by(d.memos, 'key'), kBy = by(d.asks || [], 'key');
  return d.students.map(s => {
    const vs = (vBy[s.key] || []).sort((a, b) => a.v - b.v);
    const last = vs[vs.length - 1];
    const idle = daysSince(last ? last.at : s.created);
    const checks = last ? (last.checks || []).filter(Boolean).length : 0;
    const advice = (aBy[s.key] || []).sort((a, b) => a.created < b.created ? 1 : -1);
    const drafts = advice.filter(a => a.status === '下書き');
    const asks = (kBy[s.key] || []).slice().sort((a, b) => a.at < b.at ? 1 : -1);
    const waiting = asks.filter(a => a.status === '返事待ち');
    const A = last ? analyzeQ(last.question, ctxOfVersion(last, vs, s.project || {}, true)) : null;
    const flags = [];
    if (waiting.length) flags.push('ask');
    if (!vs.length) flags.push('noq');
    else if (idle >= d.settings.staleDays) flags.push('stale');
    if (vs.length && checks <= 1) flags.push('weak');
    const past = s.question ? pmCached(s.question) : [];
    if (past.length && past[0].kind === 'form') flags.push('past');
    if (drafts.length) flags.push('draft');
    return { s, vs, last, idle, past, updates: Math.max(0, vs.length - 1), checks, flags, advice, drafts, asks, waiting, A, memos: (mBy[s.key] || []).sort((a, b) => a.at < b.at ? 1 : -1) };
  });
}

function tFiltered(rows) {
  const f = S.tf;
  const q = f.q.trim();
  const out = rows.filter(r => (!f.cls || r.s.cls === f.cls)
    && (!f.cat || (f.cat === 'none' ? !r.s.category : r.s.category === f.cat))
    && (!f.step || r.s.step === f.step)
    && (!f.flag || r.flags.includes(f.flag))
    && (!f.interest || (r.s.interests || {})[f.interest])
    && (!f.lv || (f.lv === 'none' ? !r.A : r.A && String(r.A.level) === f.lv))
    && (!q || (r.s.name + r.s.question + r.s.cls).includes(q)));
  const sorters = {
    num: (a, b) => a.s.cls.localeCompare(b.s.cls, 'ja') || a.s.num - b.s.num,
    idle: (a, b) => b.idle - a.idle,
    updates: (a, b) => b.updates - a.updates,
    lv: (a, b) => (a.A ? a.A.score : -1) - (b.A ? b.A.score : -1),
  };
  return out.sort(sorters[f.sort] || sorters.num);
}

function bars(items, filterKey) {
  const max = Math.max(1, ...items.map(i => i.n));
  return `<div class="bars">${items.map(i => {
    const tag = filterKey ? 'button' : 'div';
    const attrs = filterKey ? ` type="button" data-act="tfilter" data-k="${filterKey}" data-v="${esc(i.v)}" aria-pressed="${S.tf[filterKey] === i.v}"` : '';
    return `<${tag} class="bar-row"${attrs}><span>${esc(i.label)}</span><span class="bar-track"><i style="width:${i.n / max * 100}%;--c:${i.c || 'var(--board)'}"></i></span><span class="num">${i.n}</span></${tag}>`;
  }).join('')}</div>`;
}

    ${d.asks.length ? `<p style="margin-top:.7rem"><button type="button" class="link" data-act="t-asks-all">${S.tAllAsks ? '返事待ちだけ表示する' : `対応済みもふくめて表示する（全${d.asks.length}件）`}</button></p>` : ''}
  </section>`;

    <div class="sec"><h3>プロジェクト</h3>

function exportCsv() {
  const rows = tFiltered(tModel());
  const head = ['クラス', '番号', '名前', 'いまの問い', '洗練度', '方向', '部門', 'ステップ', '更新回数', '最終更新', '関心', '状態'];
  const cell = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
  const dirShort = { explain: '解明', solve: '解決', both: '両方', none: '未定' };
  const lines = [head.map(cell).join(',')].concat(rows.map(r => [r.s.cls, r.s.num, r.s.name, r.s.question, r.A ? LEVELS[r.A.level].name : '', r.A ? dirShort[r.A.dirKey] : '', r.s.category, r.s.step, r.updates,
    r.last ? md(r.last.at) : '', INTERESTS.filter(i => (r.s.interests || {})[i.id]).map(i => i.label).join('／'), r.flags.map(f => FLAG_LABEL[f]).join('／')].map(cell).join(',')));
  const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `探究ノート_問い一覧_${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}

async function tCall(action, payload, done) {
  try {
    const pass = sessionStorage.getItem(T_PASS);
    const r = await api(action, Object.assign({ pass, teacher: localStorage.getItem(T_NAME) || '先生' }, payload));
    if (done) done(r);
    const keep = S.tOpen;
    S.teacher = await fetchTeacher(pass);
    render();
    if (keep && $('#drawer').open) openDrawer(keep);
    return r;
  } catch (e) { toast(e.message); }
}

function goTo(id) {
  const t = document.getElementById(id);
  if (!t) return;
  if (t.tagName === 'DETAILS') { t.open = true; S.openI100 = true; }
  if (t.scrollIntoView) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
  if (id === 'sec-teacher') markRead();
}
function saveProject() {
  const p = Object.assign({ title: '', why: '', next: '' }, S.student.project);
  document.querySelectorAll('[data-proj]').forEach(el => { p[el.dataset.proj] = el.value; });
  saveFields({ project: p });
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act !== 't-sel' && el.tagName !== 'INPUT') e.preventDefault();
  switch (act) {
    case 'page': {
      S.page = el.dataset.page; render();
      if (el.dataset.to) goTo(el.dataset.to); else window.scrollTo(0, 0);
      break;
    }
    case 'jump': {
      const to = el.dataset.to;
      if (to.startsWith('sec-') && S.page !== 'home') { S.page = 'home'; render(); }
      goTo(to); break;
    }
    case 'logout': localStorage.removeItem(ME_KEY); S.me = null; S.student = null; S.chat = []; S.diag = {}; S.suggest = null; S.asks = null; S.asksOk = null; S.page = 'home'; render(); break;
    case 'open-update': openUpdate(null, el.dataset.trig || null); break;
    case 'open-chat': openChat(); break;
    case 'close-dlg': $('#dlg').close(); S.dlg = null; break;
    case 'set-step': {
      if (S.student.step === el.dataset.step) break;
      await saveFields({ step: el.dataset.step }, true); render(); toast(`いまの段階を「${el.dataset.step}」にしました。`); break;
    }
    case 'focus-next': { const i = $('#nextInput'); if (i) { i.scrollIntoView({ behavior: 'smooth', block: 'center' }); i.focus(); } break; }
    case 'use-seed': openUpdate(el.dataset.text, S.versions.length ? 'その他' : null); break;
    case 'interest': {
      const it = Object.assign({}, S.student.interests); it[el.dataset.id] = !it[el.dataset.id]; if (!it[el.dataset.id]) delete it[el.dataset.id];
      saveFields({ interests: it }, true); render();
      if (it[el.dataset.id]) toast('探究部の先生に伝わりました。予定にも目立って出ます。'); break;
    }
    case 'fdot': S.fsel = Number(el.dataset.v); render(); break;
    case 'toggle-lineage': S.allLineage = !S.allLineage; render(); break;
    case 'site': {
      const site = SEARCH_SITES.find(s => s.id === el.dataset.site);
      const q = ($('#kwInput') && $('#kwInput').value.trim()) || '';
      if (!q) { toast('探すことばを入れてください。'); break; }
      window.open(site.url(q), '_blank', 'noopener');
      break;
    }
    case 'coach-tip': {
      const A = curA(); if (!A) break;
      const k = IND.find(i => i.id === A.weakest);
      openChat(`いまの問いは「${A.q}」です。問いの指標では「${k.label}」が弱いと出ました。${k.label}を上げるには、どう考えればいいですか？`); break;
    }
    case 'ask-refresh': refreshAll(); break;
    case 'starter': sendChat(el.dataset.text); break;
    case 'chat-to-update': openUpdate(null, 'AIと壁打ちした'); break;
    case 'advice-to-update': openUpdate(null, '先生のアドバイス'); break;
    case 'diag': S.diag[el.dataset.i] = Number(el.dataset.j); render(); goTo('g-diag'); break;
    case 'set-cat': { const c = el.dataset.cat; await saveFields({ category: S.student.category === c ? '' : c }, true); render(); break; }
    case 'suggest-cat': {
      el.disabled = true; el.textContent = 'AIが考えています…';
      try { const r = await api('student.suggestCategory', ident()); S.suggest = r.suggestion; S.aiLeft = r.aiLeft; S.openI100 = true; } catch (err) { toast(err.message); }
      render(); goTo('sec-i100'); break;
    }
    case 'check-item': { const cl = Object.assign({}, S.student.checklist); cl[el.dataset.id] = el.checked; if (!el.checked) delete cl[el.dataset.id]; saveFields({ checklist: cl }, true); break; }
    case 'past-f': S.pastF[el.dataset.k] = el.dataset.v; render(); goTo('g-past'); break;
    case 'past-ai': openChat(`過去の受賞問い「${el.dataset.q}」が気になっています。同じ問いにはできないので、自分だけの問いにするにはどうしたらいいですか？`); break;
    case 'teacher-open': S.mode = 'teacher'; teacherLoad(); break;
    case 'student-open': S.mode = 'student'; render(); break;
    // ---- 先生用 ----
    case 't-refresh': toast('最新にしています…'); teacherLoad(); break;
    case 'tfilter': { const k = el.dataset.k; S.tf[k] = S.tf[k] === el.dataset.v ? '' : el.dataset.v; render(); break; }
    case 't-sel': e.stopPropagation(); if (el.checked) S.tSel.add(el.dataset.key); else S.tSel.delete(el.dataset.key); render(); break;
    case 't-selall': tFiltered(tModel()).forEach(r => S.tSel.add(r.s.key)); render(); break;
    case 't-selnone': S.tSel.clear(); render(); break;
    case 't-open': openDrawer(el.dataset.key); break;
    case 'close-drawer': $('#drawer').close(); S.tOpen = null; break;
    case 't-tpl': $('#d-text').value = ADVICE_TEMPLATES[el.dataset.i]; $('#d-text').focus(); break;
    case 'c-tpl': $('#composeForm textarea').value = ADVICE_TEMPLATES[el.dataset.i]; break;
    case 't-compose': openCompose(); break;
    case 't-send-one': {
      const text = $('#d-text').value.trim();
      if (!text) return toast('アドバイスを書いてください。');
      await tCall('teacher.send', { keys: [el.dataset.key], text }, () => toast('アドバイスを送りました。')); break;
    }
    case 't-aidraft': {
      el.disabled = true; el.textContent = '下書き中…';
      try { const r = await api('teacher.aiDraft', { pass: sessionStorage.getItem(T_PASS), key: el.dataset.key }); $('#d-text').value = r.text; } catch (err) { toast(err.message); }
      el.disabled = false; el.textContent = 'AIで下書き'; break;
    }
    case 't-memo': {
      const text = $('#d-memo').value.trim();
      if (!text) return toast('メモを書いてください。');
      await tCall('teacher.memo', { key: el.dataset.key, text }, () => toast('メモを残しました。')); break;
    }
    case 't-approve': {
      const text = $('#draft-' + el.dataset.id).value.trim();
      await tCall('teacher.approve', { id: el.dataset.id, text }, () => toast('アドバイスを送りました。')); break;
    }
    case 't-discard': await tCall('teacher.discard', { id: el.dataset.id }, () => toast('この下書きは送りません。')); break;
    case 't-answer': {
      const box = $('#ans-' + el.dataset.id);
      const text = box ? box.value.trim() : '';
      if (!text) return toast('返事を書いてください。直接話したときは「直接話したので完了」をおしてください。');
      el.disabled = true;
      await tCall('teacher.answer', { id: el.dataset.id, text }, () => toast('返事を送りました。')); break;
    }
    case 't-answer-done': el.disabled = true; await tCall('teacher.answer', { id: el.dataset.id, text: '', done: true }, () => toast('対応済みにしました。')); break;
    case 't-asks-all': S.tAllAsks = !S.tAllAsks; render(); break;
    case 't-runauto': await tCall('teacher.runAuto', {}, r => toast(`自動のアドバイスを${(r.auto && r.auto.sent) || 0}件送りました。`)); break;
    case 't-csv': exportCsv(); break;
    case 't-alldrafts': S.tAllDrafts = !S.tAllDrafts; render(); break;
  }
});

document.addEventListener('submit', async e => {
  const f = e.target;
  e.preventDefault();
  if (f.id === 'loginForm') login(f);
  else if (f.id === 'updForm') submitUpdate(f);
  else if (f.id === 'askForm') submitAsk(f);
  else if (f.id === 'chatForm') { const ta = f.elements.namedItem('m'); const t = ta.value; ta.value = ''; sendChat(t); }
  else if (f.id === 'teacherForm') {
    localStorage.setItem(T_NAME, fv(f, 'tname').trim());
    sessionStorage.setItem(T_PASS, fv(f, 'pass'));
    teacherLoad();
  } else if (f.id === 'composeForm') {
    const text = fv(f, 'text').trim();
    if (!text) return toast('本文を書いてください。');
    const keys = [...S.tSel];
    $('#dlg').close();
    await tCall('teacher.send', { keys, text }, r => { toast(`${r.sent}人にアドバイスを送りました。`); S.tSel.clear(); });
  }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.proj) saveProject();
  if (el.closest && el.closest('#updForm')) { clearTimeout(S.pcTimer); S.pcTimer = setTimeout(updateLive, 200); }

  if (el.dataset.tf === 'q') { S.tf.q = el.value; clearTimeout(S.tqTimer); S.tqTimer = setTimeout(() => { render(); const i = $('[data-tf="q"]'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 350); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.tf && el.dataset.tf !== 'q') { S.tf[el.dataset.tf] = el.value; render(); }
  if (el.closest && el.closest('#updForm') && el.type === 'checkbox') updateLive();
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.matches('#chatForm textarea') && e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); t.form.requestSubmit(); }

  if ((e.key === 'Enter' || e.key === ' ') && t.closest && t.closest('.fdot')) { e.preventDefault(); t.closest('.fdot').dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
$('#dlg').addEventListener('close', () => { S.dlg = null; });

(async function boot() {
  if (location.hash === '#teacher') { S.mode = 'teacher'; return teacherLoad(); }
  let me = null;
  try { me = JSON.parse(localStorage.getItem(ME_KEY)); } catch (e) { me = null; }
  if (!me) return render();
  $('#app').innerHTML = '<div class="login"><p style="color:var(--chalk)">ノートをひらいています…</p></div>';
  try { const b = await api('student.login', me); S.me = me; setBundle(b); } catch (e) { localStorage.removeItem(ME_KEY); toast(e.message); }
