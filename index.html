<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>探究ノート｜明星 高2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --board:#102A22; --board-2:#1C4034; --chalk:#F4F1E8;
  --desk:#E9ECE6; --paper:#FFFEFA; --rule:#DAE3EA; --rule-2:#C3D1DC;
  --pencil:#26302C; --pencil-2:#56615C; --pencil-3:#8C9691;
  --marker:#F28A1E; --marker-dk:#A94E07; --marker-tint:#FDEBD6;
  --redpen:#BE3528; --redpen-tint:#FBEDEA;
  --sb:#2F5D8A; --hc:#94476F; --st:#2A7564;
  --line:#E1E4DE; --line-2:#C9CEC6;
  --ui:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --hand:"Klee One","BIZ UDPGothic","Hiragino Kaku Gothic ProN",sans-serif;
  --lh:2.6rem;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--pencil);font-family:var(--ui);font-size:16px;line-height:1.75}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
h1,h2,h3{line-height:1.4;margin:0}
p{margin:0}
.hand{font-family:var(--hand)}
.fine{font-size:.85rem;color:var(--pencil-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- header / tabs ---------- */
.bar{position:sticky;top:0;z-index:20;background:var(--board);color:var(--chalk);padding-top:env(safe-area-inset-top)}
.bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:.75rem;padding:.65rem 1rem}
.bar.wide .bar-in{max-width:1280px}
.brand{font-weight:700;letter-spacing:.06em}
.who{margin-left:auto;font-size:.88rem;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .link{color:var(--chalk);opacity:.85}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--board);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;max-width:180px;background:none;border:0;color:rgba(244,241,232,.72);padding:.55rem .2rem .6rem;display:flex;flex-direction:column;align-items:center;gap:.1rem;font-size:.75rem;position:relative}
.tabs button[aria-current="page"]{color:var(--chalk)}
.tabs button[aria-current="page"]::after{content:"";position:absolute;top:0;left:32%;right:32%;height:3px;background:var(--marker);border-radius:0 0 3px 3px}
.tabs svg{width:24px;height:24px}
.dot{position:absolute;top:.4rem;left:calc(50% + 8px);min-width:1.1rem;height:1.1rem;padding:0 .3rem;border-radius:999px;background:var(--redpen);color:#fff;font-size:.68rem;line-height:1.1rem}
@media (min-width:900px){
  .tabs{position:sticky;top:48px;bottom:auto;z-index:19;background:var(--board-2)}
  .tabs button{flex-direction:row;gap:.45rem;font-size:.9rem;padding:.55rem 1rem;max-width:200px}
  .tabs button[aria-current="page"]::after{top:auto;bottom:0;border-radius:3px 3px 0 0}
  .tabs svg{width:20px;height:20px}
  .dot{position:static}
}

/* ---------- notebook sheet ---------- */
.sheet{max-width:760px;margin:0 auto;background:var(--paper);min-height:calc(100vh - 48px);padding:1.4rem 1.25rem 7.5rem;box-shadow:0 0 0 1px var(--line)}
@media (min-width:900px){.sheet{padding-bottom:4rem;margin-top:1rem;min-height:auto;border-radius:4px}}
.page+.page{margin-top:2.2rem}
.label{font-size:.85rem;color:var(--pencil-2);display:flex;align-items:baseline;gap:.6rem}
.h{font-size:1.15rem;font-weight:700;margin-bottom:.6rem}
.lead{color:var(--pencil-2);margin-bottom:1rem}
.q{font-family:var(--hand);font-weight:600;font-size:clamp(1.3rem,4.4vw,1.75rem);line-height:var(--lh);margin:.3rem 0 1rem;overflow-wrap:anywhere;
   background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px),var(--rule) var(--lh))}
.q.empty{color:var(--pencil-3);font-weight:400;font-size:1.2rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.row.end{justify-content:flex-end}
.meta{display:flex;flex-wrap:wrap;gap:.8rem 1.6rem;align-items:center;margin:.2rem 0 1.1rem}

/* tally 正 */
.tally-wrap{display:flex;align-items:center;gap:.45rem;font-size:.9rem;color:var(--pencil-2)}
.tally-wrap b{color:var(--pencil)}
.tallies{display:inline-flex;gap:3px}
.tally{width:24px;height:24px;stroke:var(--pencil);stroke-width:2.2;stroke-linecap:round;fill:none}

/* self-check dots */
.checks{display:flex;flex-wrap:wrap;gap:.2rem .9rem;font-size:.82rem;color:var(--pencil-2)}
.check{display:inline-flex;align-items:center;gap:.35rem}
.check i{width:.72rem;height:.72rem;border-radius:50%;border:2px solid var(--pencil-3);display:inline-block}
.check.on{color:var(--pencil)}
.check.on i{background:var(--board);border-color:var(--board)}
.checks.mini{gap:3px}
.checks.mini .check i{width:.6rem;height:.6rem}

/* buttons, chips */
.btn{appearance:none;border:0;border-radius:10px;padding:.72rem 1.1rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:44px;text-decoration:none}
.btn.primary{background:var(--marker);color:var(--board)}
.btn.primary:hover{background:#E67D10}
.btn.dark{background:var(--board);color:var(--chalk)}
.btn.ghost{background:transparent;border:1.5px solid var(--line-2);color:var(--pencil)}
.btn.ghost:hover{border-color:var(--pencil-3)}
.btn.small{min-height:36px;padding:.4rem .8rem;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:var(--marker-dk);text-decoration:underline;text-underline-offset:3px;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{display:inline-flex;align-items:center;border:1.5px solid var(--line-2);border-radius:999px;padding:.35rem .8rem;background:#fff;font-size:.9rem;min-height:36px;cursor:pointer;user-select:none}
.chip[aria-pressed="true"],.chip:has(input:checked){background:var(--board);border-color:var(--board);color:var(--chalk)}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip:has(input:focus-visible){outline:3px solid var(--marker);outline-offset:2px}
.seg{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 1.2rem}
.seg .chip{white-space:nowrap}

/* cycle */
.cycle{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
.step{width:100%;border:1.5px solid var(--line-2);background:#fff;border-radius:10px;padding:.55rem .2rem;display:flex;flex-direction:column;align-items:center;gap:.1rem;font-size:.8rem;font-weight:700;min-height:64px;word-break:keep-all;line-height:1.35;text-align:center}
.step .n{font-size:.72rem;color:var(--pencil-3);font-weight:400}
.step[aria-pressed="true"]{background:var(--board);border-color:var(--board);color:var(--chalk)}
.step[aria-pressed="true"] .n{color:var(--marker)}
.loop{display:flex;align-items:center;gap:.4rem;font-size:.85rem;color:var(--marker-dk);margin-top:.5rem}
.loop svg{width:18px;height:18px}

/* lineage */
.lineage{list-style:none;margin:0;padding:0 0 0 1.6rem;position:relative}
.lineage::before{content:"";position:absolute;left:.5rem;top:.9rem;bottom:1.4rem;width:2px;background:var(--rule-2)}
.lv{position:relative;padding:.35rem 0 1.15rem}
.lv::before{content:"";position:absolute;left:-1.42rem;top:.8rem;width:.85rem;height:.85rem;border-radius:50%;background:var(--paper);border:2px solid var(--pencil-3)}
.lv.current::before{background:var(--marker);border-color:var(--marker)}
.lv-q{font-family:var(--hand);font-size:1.12rem;line-height:1.75;overflow-wrap:anywhere}
.lv.past .lv-q{color:var(--pencil-2)}
.lv-meta{font-size:.8rem;color:var(--pencil-3);margin-top:.15rem;display:flex;flex-wrap:wrap;gap:.2rem .7rem;align-items:center}
.trig{display:inline-block;border:1px solid var(--line-2);border-radius:999px;padding:0 .5rem;color:var(--pencil-2);background:#fff}
.lv-note{font-size:.88rem;color:var(--pencil-2);margin-top:.25rem;padding-left:.7rem;border-left:2px solid var(--rule)}
.struck{background-image:linear-gradient(var(--pencil-2),var(--pencil-2));background-repeat:no-repeat;background-position:0 60%;background-size:100% 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.struck.anim{animation:strike .8s ease-out .2s both}
@keyframes strike{from{background-size:0 2px}to{background-size:100% 2px}}
.fresh{animation:fresh 1s ease-out both}
@keyframes fresh{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.struck.anim,.fresh{animation:none}}

/* notebook list items */
.item{padding:1rem 0;border-top:1px solid var(--rule)}
.item:last-child{border-bottom:1px solid var(--rule)}
.item h3{font-size:1.02rem}
.item .sub{font-size:.85rem;color:var(--pencil-2)}
.seeds{list-style:none;margin:.5rem 0 0;padding:0;display:grid;gap:.35rem}
.seed{display:flex;gap:.6rem;align-items:flex-start;justify-content:space-between}
.seed span{font-family:var(--hand);font-size:1.02rem}
.seed .link{white-space:nowrap;font-size:.82rem}
.facts{display:grid;grid-template-columns:auto 1fr;gap:.1rem .9rem;font-size:.9rem;margin:.5rem 0}
.facts dt{color:var(--pencil-2)}
.facts dd{margin:0}
.toggle{border:1.5px solid var(--marker);background:#fff;color:var(--marker-dk);border-radius:999px;padding:.3rem .8rem;font-size:.85rem;font-weight:700;min-height:36px}
.toggle[aria-pressed="true"]{background:var(--marker);color:var(--board)}
.cat{display:inline-flex;align-items:center;gap:.35rem;font-size:.82rem;font-weight:700;color:var(--c)}
.cat::before{content:"";width:.6rem;height:.6rem;border-radius:50%;background:var(--c)}
.book{display:grid;gap:.15rem}
.book b{font-size:1rem}
.book .by{font-size:.85rem;color:var(--pencil-2)}
.rewrite{display:grid;gap:.2rem;margin-top:.4rem}
.rewrite .from{font-family:var(--hand);color:var(--pencil-2)}
.rewrite .to{font-family:var(--hand);font-size:1.05rem}

/* chat */
.msgs{display:flex;flex-direction:column;gap:.7rem;margin:1rem 0}
.msg{max-width:88%;padding:.7rem .9rem;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:#fff;border:1.5px solid var(--line-2);font-family:var(--hand);font-size:1.02rem}
.msg.coach{align-self:flex-start;background:#EEF3F0;border:1.5px solid #D6E2DB}
.msg.coach .who2{display:block;font-size:.75rem;color:var(--pencil-2);margin-bottom:.15rem}
.msg.wait{color:var(--pencil-3)}
.chat-form .btn{flex:none;white-space:nowrap}
.chat-form{display:flex;gap:.5rem;align-items:flex-end;position:sticky;bottom:calc(70px + env(safe-area-inset-bottom));background:var(--paper);padding:.5rem 0}
@media (min-width:900px){.chat-form{bottom:0}}
textarea,input[type=text],input[type=number],input[type=password],select{width:100%;border:1.5px solid var(--line-2);border-radius:10px;padding:.6rem .75rem;background:#fff;font-size:16px}
textarea{resize:vertical;line-height:1.7}
textarea.hand{font-family:var(--hand);font-size:1.1rem}
.field{display:grid;gap:.3rem;margin:0 0 1rem;border:0;padding:0}
.field>span,.field legend{font-size:.88rem;font-weight:700;color:var(--pencil-2);padding:0;margin-bottom:.3rem}
.cb{display:flex;gap:.55rem;align-items:flex-start;padding:.3rem 0;cursor:pointer}
.cb input{width:1.2rem;height:1.2rem;margin-top:.25rem;accent-color:var(--board);flex:none}

/* project */
.countdown{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;background:var(--board);color:var(--chalk);border-radius:12px;padding:1rem 1.1rem}
.countdown .n{font-size:2.4rem;font-weight:700;color:var(--marker);line-height:1}
.progress{height:10px;background:var(--rule);border-radius:999px;overflow:hidden;margin:.4rem 0 .8rem}
.progress i{display:block;height:100%;background:var(--board)}
.diag{display:grid;gap:1rem;margin:.6rem 0 1rem}
.diag p{font-weight:700;font-size:.95rem;margin-bottom:.35rem}
.result{border:2px solid var(--c);border-radius:12px;padding:1rem;margin:.8rem 0;background:#fff}
.result h3{color:var(--c);font-size:1.15rem}

/* red pen inbox */
.adv{padding:1rem 0;border-top:1px solid var(--rule);position:relative}
.adv:last-child{border-bottom:1px solid var(--rule)}
.adv .from{font-size:.8rem;color:var(--pencil-2);display:flex;gap:.6rem;align-items:center}
.adv .body{font-family:var(--hand);color:var(--redpen);font-size:1.12rem;line-height:1.85;margin-top:.25rem;white-space:pre-wrap;overflow-wrap:anywhere}
.adv.auto .body{color:var(--pencil)}
.adv.unread::before{content:"";position:absolute;left:-.9rem;top:1.35rem;width:.5rem;height:.5rem;border-radius:50%;background:var(--redpen)}
.new{font-size:.7rem;background:var(--redpen);color:#fff;border-radius:4px;padding:0 .35rem}

/* login */
.login{min-height:100vh;background:var(--board);display:grid;place-items:center;padding:2rem 1rem}
.login-in{width:100%;max-width:440px}
.login h1{color:var(--chalk);font-size:2.4rem;letter-spacing:.08em}
.login .kicker{color:var(--marker);font-weight:700;font-size:.9rem;margin-bottom:.4rem}
.login .lead{color:#C9D6CF;margin:.4rem 0 1.4rem}
.login form{background:var(--paper);border-radius:14px;padding:1.3rem}
.login .grid2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.login .foot{margin-top:1.2rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.login .foot .link{color:#E9C9A3}
.demo{background:var(--marker-tint);color:var(--marker-dk);border-radius:10px;padding:.6rem .8rem;font-size:.85rem;margin-top:1rem}
.login .demo{background:rgba(242,138,30,.14);color:#F6C38E}

/* dialog */
dialog{overflow:auto;border:0;border-radius:16px;padding:0;width:min(640px,calc(100vw - 1.5rem));max-height:calc(100vh - 2rem);background:var(--paper);color:var(--pencil)}
dialog::backdrop{background:rgba(16,42,34,.55)}
.dlg{padding:1.3rem 1.25rem}
.dlg h2{font-size:1.2rem;margin-bottom:.9rem}
.prev{font-family:var(--hand);color:var(--pencil-2);margin-bottom:.9rem}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--board);color:var(--chalk);padding:.6rem 1rem;border-radius:10px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100;max-width:90vw}
#toast.show{opacity:1}
.busy{opacity:.6;pointer-events:none}

/* past Inspired100 questions */
.pastcheck{border-radius:10px;padding:.7rem .85rem;font-size:.9rem;margin:.2rem 0 1rem;line-height:1.7}
.pastcheck ul{margin:.35rem 0;padding-left:1.1rem}
.pastcheck li{color:var(--pencil)}
.pastcheck.same{background:var(--redpen-tint);color:var(--redpen);border:1.5px solid var(--redpen)}
.pastcheck.near{background:var(--marker-tint);color:var(--marker-dk)}
p.pastcheck.ok{padding:0;color:var(--st);font-size:.85rem}
.past{padding:.7rem 0;border-top:1px solid var(--rule);display:grid;gap:.15rem}
.past .hand{font-size:1.02rem}
.flag.past{color:var(--hc);border-color:var(--hc)}

/* ---------- teacher ---------- */
.t-wrap{max-width:1280px;margin:0 auto;padding:1.2rem 1rem 4rem;display:grid;gap:1rem}
.panel{background:#fff;border-radius:12px;padding:1.1rem 1.2rem;border:1px solid var(--line)}
.panel h2{font-size:1.02rem;margin-bottom:.7rem}
.t-sum{font-size:1.05rem;line-height:1.9}
.t-sum b{font-size:1.35rem;color:var(--board)}
.t-sum .warn b{color:var(--redpen)}
.t-grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.bars{display:grid;gap:.45rem}
.bar-row{display:grid;grid-template-columns:9.5rem 1fr 2.2rem;gap:.5rem;align-items:center;font-size:.85rem;background:none;border:0;padding:0;text-align:left;width:100%}
button.bar-row:hover .bar-track{outline:2px solid var(--line-2)}
.bar-row[aria-pressed="true"] span:first-child{font-weight:700;text-decoration:underline}
.bar-track{height:14px;background:#F0F2EE;border-radius:4px;overflow:hidden}
.bar-track i{display:block;height:100%;background:var(--c,var(--board))}
.bar-row .num{text-align:right;font-weight:700}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.5rem;margin-bottom:.8rem}
.filters select,.filters input{padding:.45rem .6rem}
.bulk{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:.6rem;font-size:.9rem}
.list{display:grid}
.lrow{display:grid;grid-template-columns:2rem 5rem 6.5rem 1fr 8.5rem 5.2rem 5.6rem 6.5rem;gap:.6rem;align-items:center;padding:.6rem .3rem;border-top:1px solid var(--line);font-size:.88rem;cursor:pointer}
.lrow:hover{background:#FAFBF8}
.lrow.head{cursor:default;font-size:.78rem;color:var(--pencil-2);border-top:0;background:none}
.lrow .lq{font-family:var(--hand);font-size:.98rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lrow .none{color:var(--pencil-3);font-family:var(--ui);font-size:.85rem}
.lrow input{width:1.1rem;height:1.1rem;accent-color:var(--board)}
.flag{display:inline-block;font-size:.72rem;border-radius:4px;padding:0 .35rem;margin:1px 2px 1px 0;border:1px solid}
.flag.noq{color:var(--redpen);border-color:var(--redpen)}
.flag.stale{color:var(--marker-dk);border-color:var(--marker)}
.flag.weak{color:var(--pencil-2);border-color:var(--line-2)}
.flag.draft{color:var(--board);border-color:var(--board)}
.small-tally .tally{width:16px;height:16px;stroke-width:2.4}
@media (max-width:980px){
  .lrow{grid-template-columns:1.6rem 1fr auto;grid-template-areas:"cb name last" "cb q q" "cb cat flags"}
  .lrow.head{display:none}
  .lrow>:nth-child(1){grid-area:cb}
  .lrow>:nth-child(2){display:none}
  .lrow>:nth-child(3){grid-area:name;font-weight:700}
  .lrow>:nth-child(4){grid-area:q}
  .lrow>:nth-child(5){grid-area:cat}
  .lrow>:nth-child(6){display:none}
  .lrow>:nth-child(7){grid-area:last;font-size:.8rem}
  .lrow>:nth-child(8){grid-area:flags;justify-self:end}
}
.drafts{display:grid;gap:.9rem}
.draft{border:1px solid var(--line);border-radius:10px;padding:.8rem .9rem;display:grid;gap:.45rem}
.draft .who3{font-size:.85rem;color:var(--pencil-2)}
.draft .lq{font-family:var(--hand)}
dialog.drawer{margin:0 0 0 auto;height:100vh;max-height:100vh;width:min(560px,100vw);border-radius:0}
.drawer .dlg{padding-bottom:3rem}
.drawer-head{display:flex;align-items:flex-start;gap:.8rem;justify-content:space-between;margin-bottom:.8rem}
.sec{margin-top:1.4rem}
.sec h3{font-size:.95rem;margin-bottom:.5rem;color:var(--pencil-2)}
.memo{border-top:1px solid var(--line);padding:.55rem 0;font-size:.92rem}
.memo .by{font-size:.78rem;color:var(--pencil-3)}
.rules{display:grid;gap:.5rem;margin:.4rem 0 1rem;padding:0;list-style:none}
.rules li{display:grid;grid-template-columns:5.5rem 1fr;gap:.6rem;font-size:.9rem}
.state{font-weight:700;font-size:.8rem}
.state.on{color:var(--st)}
.state.off{color:var(--redpen)}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<dialog id="drawer" class="drawer"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ============================================================
   1. 設定 — ここを書きかえるだけで使えます
   ============================================================ */
const CONFIG = {
  // Google Apps Script の「ウェブアプリのURL」。空欄のあいだはデモモード（この端末だけで動きます）
  API_URL: 'https://script.google.com/a/macros/edu.meisei.ac.jp/s/AKfycbyUgQP_YK6YxkiVrFHFgnUifvpa2yZ9OtXIdBmLoAjr39Qwi7iPX2EDBA3jvZicGasn/exec',
  // Gemini で作った「問いの壁打ちGem」の共有リンク（任意）。入れると「AIと壁打ち」にボタンが出ます
  GEM_URL: '',

   3. 道具・通信
   ============================================================ */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const DEMO = !CONFIG.API_URL;
const DAY = 86400000;
function daysSince(iso) { return iso ? (Date.now() - new Date(iso)) / DAY : 0; }
function daysLeft(iso) { return Math.ceil((new Date(iso) - Date.now()) / DAY); }
function md(iso) { if (!iso) return ''; const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()}`; }
function rel(iso) { if (!iso) return '—'; const d = Math.floor(daysSince(iso)); return d <= 0 ? '今日' : d === 1 ? '昨日' : `${d}日前`; }
function catOf(id) { return CATS.find(c => c.id === id); }
function catTag(id) { const c = catOf(id); return c ? `<span class="cat" style="--c:${c.color}">${esc(c.id)}</span>` : '<span class="fine">部門 未定</span>'; }
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600); }

async function api(action, payload = {}) {
  if (DEMO) { await sleep(150); return Demo.handle(action, payload); }
  const body = JSON.stringify(Object.assign({ action }, payload));
  for (let i = 0; i < 3; i++) {
    let data;
    try {
      const res = await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body });
      data = await res.json();
    } catch (e) {
      await sleep(900 * (i + 1) + Math.random() * 700);   // 混雑・通信エラーは少し待って再送
      continue;
    }
    if (!data.ok) throw new Error(data.error || 'うまくいきませんでした。');
    return data;
  }
  throw new Error('通信できませんでした。電波のよい場所で、もう一度ためしてください。');
}

/* 正の字（更新回数） */
function tally(n, cls = '') {
  if (!n) return '<span class="fine">まだなし</span>';
  const strokes = ['M3 4H21', 'M12 4V20', 'M12 12H19', 'M6 12V20', 'M3 20H21'];
  const one = k => `<svg class="tally" viewBox="0 0 24 24" aria-hidden="true"><path d="${strokes.slice(0, k).join(' ')}"/></svg>`;
  return `<span class="tallies ${cls}" role="img" aria-label="${n}回">${one(5).repeat(Math.floor(n / 5))}${n % 5 ? one(n % 5) : ''}</span>`;
}
function checkDots(checks, mini = false) {
  return `<span class="checks${mini ? ' mini' : ''}" aria-label="問いのセルフチェック ${(checks || []).filter(Boolean).length}/4">${CHECKS.map((c, i) =>
    `<span class="check${checks && checks[i] ? ' on' : ''}" title="${esc(c.label)}"><i></i>${mini ? '' : esc(c.short)}</span>`).join('')}</span>`;
}

/* ---------- 過去の受賞問いとの重なりチェック（Code.gs と同じ考え方）---------- */
function normQ(s) {
  let t = String(s || '').normalize('NFKC').toLowerCase();
  t = t.replace(/[\s、。，．,.!?！？「」『』“”"'‘’・…〜~()（）［］\[\]【】:：;；]/g, '');
  t = t.replace(/何故|なんで|どうして/g, 'なぜ').replace(/って/g, 'とは').replace(/なに|なん(?=だ|で)/g, '何').replace(/子ども|こども/g, '子供');
  const ends = ['どうすればよい', 'どうすればいい', 'どうしたらよい', 'どうしたらいい', 'のでしょうか', 'でしょうか', 'のだろうか', 'だろうか', 'のだろう', 'だろう', 'とは何', 'なのか', 'のか', 'なの', 'か', 'の', 'とは'];
  for (let pass = 0; pass < 3; pass++) {
    const e = ends.find(x => t.endsWith(x) && t.length - x.length >= 2);
    if (!e) break;
    t = t.slice(0, -e.length);
  }
  return t;
}
function qGrams(t) { const g = new Set(); if (t.length < 2) { if (t) g.add(t); return g; } for (let i = 0; i < t.length - 1; i++) g.add(t.slice(i, i + 2)); return g; }
function longestRun(a, b) {
  let best = 0;
  for (let i = 0; i < a.length; i++) for (let j = 0; j < b.length; j++) {
    let k = 0; while (i + k < a.length && j + k < b.length && a[i + k] === b[j + k]) k++;
    if (k > best) best = k;
  }
  return best;
}
const PAST = PAST_I100.map(([y, c, p, q]) => { const n = normQ(q); return { y, c, p, q, n, g: qGrams(n) }; });
// level: same（ほぼ同じ・保存できない）/ near（近い・参考）、kind: form（問いの形が近い）/ theme（テーマが同じ）
function pastMatches(q, max = 3) {
  const A = normQ(q);
  if (A.length < 2) return [];
  const ga = qGrams(A);
  const out = [];
  PAST.forEach(p => {
    let dice, cover, run;
    if (A === p.n) { dice = 1; cover = 1; run = A.length; }
    else {
      let n = 0; p.g.forEach(x => { if (ga.has(x)) n++; });
      dice = 2 * n / (ga.size + p.g.size); cover = p.g.size >= 4 ? n / p.g.size : 0; run = longestRun(A, p.n);
    }
    if (dice >= 0.8) out.push({ p, level: 'same', kind: 'form', score: dice });
    else if (dice >= 0.5 || cover >= 0.6) out.push({ p, level: 'near', kind: 'form', score: Math.max(dice, cover * 0.9) });
    else if (run >= 7) out.push({ p, level: 'near', kind: 'theme', score: run / 20 });
  });
  const rank = m => (m.level === 'same' ? 2 : m.kind === 'form' ? 1 : 0);
  return out.sort((a, b) => rank(b) - rank(a) || b.score - a.score).slice(0, max);
}

function pastCheckHtml(q) {
  const m = pastMatches(q);
  if (!m.length) return q && normQ(q).length >= 2 ? '<p class="pastcheck ok">過去2年の Inspired100 の問いとは重なっていません。</p>' : '';
  const li = m.map(x => `<li><span class="hand">${esc(x.p.q)}</span><span class="fine">（${esc(pastLabel(x.p))}）</span></li>`).join('');
  if (m[0].level === 'same') return `<div class="pastcheck same"><b>過去の Inspired100 の問いと、ほぼ同じです。このままでは保存できません。</b><ul>${li}</ul><p>自分の体験や、場所（府中・明星）、対象、比べる相手を加えて、自分だけの問いにしよう。</p></div>`;
  if (m[0].kind === 'form') return `<div class="pastcheck near"><b>形の近い問いが、過去に選ばれています（参考）。</b><ul>${li}</ul><p>同じにならないように、自分だけの視点をはっきりさせよう。</p></div>`;
  return `<div class="pastcheck near"><b>同じテーマの問いが、過去に選ばれています（参考）。</b><ul>${li}</ul></div>`;
}

/* ---------- ノート ---------- */
function viewNote() {
  const vs = S.versions, cur = vs[vs.length - 1], st = S.student;
  const updates = Math.max(0, vs.length - 1);
  const head = cur ? `
    <section class="page">
      <p class="label">いまの問い <span>${vs.length}つめの問い</span></p>
      <p class="q${S.justUpdated ? ' fresh' : ''}">${esc(cur.question)}</p>
      <div class="meta">
        <span class="tally-wrap">更新 ${tally(updates)} <b>${updates}回</b></span>
        ${checkDots(cur.checks)}
      </div>
      <div class="row"><button type="button" class="btn primary" data-act="open-update">問いを更新する</button>
        <button type="button" class="btn ghost" data-act="go" data-view="hints">ヒントを見る</button></div>
    </section>` : `
    <section class="page">
      <p class="label">いまの問い</p>
      <p class="q empty">まだ問いがありません。気になっていることを、1行で書いてみよう。</p>
      <div class="row"><button type="button" class="btn primary" data-act="open-update">最初の問いを書く</button>
        <button type="button" class="btn ghost" data-act="go" data-view="hints">問いの種を見る</button></div>
    </section>`;
  const cycle = `
    <section class="page">
      <h2 class="h">いま、どのステップ？</h2>
      <ol class="cycle">${STEPS.map((s, i) => `<li><button type="button" class="step" data-act="set-step" data-step="${s}" aria-pressed="${st.step === s}"><span class="n">STEP ${i + 1}</span>${s.replace('・', '・<wbr>')}</button></li>`).join('')}</ol>
      <p class="loop">${ICONS.loop}問いが更新されたら、また STEP 1 へ。探究とは、問いが更新されること。</p>
    </section>`;
  const lineage = vs.length ? `
    <section class="page">
      <h2 class="h">問いの系譜</h2>
      <p class="lead">前の問いは消さずに線を引いて残します。線の数だけ、探究が進んだしるしです。</p>
      <ol class="lineage">${vs.slice().reverse().map((v, i) => {
        const past = i > 0;
        const anim = S.justUpdated && i === 1 ? ' anim' : '';
        return `<li class="lv ${past ? 'past' : 'current'}">
          <div class="lv-q">${past ? `<span class="struck${anim}">${esc(v.question)}</span>` : esc(v.question)}</div>

          ${v.note ? `<p class="lv-note">${esc(v.note)}</p>` : ''}</li>`;
      }).join('')}</ol>
    </section>` : '';
  return head + cycle + lineage;
}

function openUpdate(prefill, trigger) {
  const cur = S.versions[S.versions.length - 1];
  const first = !cur;
  const text = prefill != null ? prefill : (cur ? cur.question : '');
  const dlg = $('#dlg');
  dlg.innerHTML = `
    <form class="dlg" id="updForm">
      <h2>${first ? '最初の問いを書く' : '問いを更新する'}</h2>
      ${first ? '' : `<p class="prev">いまの問い：<span class="struck">${esc(cur.question)}</span></p>`}
      <label class="field"><span>${first ? '問い' : '新しい問い（いまの問いを書きかえよう）'}</span>
        <textarea name="q" rows="3" maxlength="300" class="hand" required>${esc(text)}</textarea></label>
      <div id="pastCheck" aria-live="polite">${pastCheckHtml(text)}</div>
      ${first ? '' : `<fieldset class="field"><legend>更新のきっかけ</legend><div class="chips">${TRIGGERS.map(t =>
        `<label class="chip"><input type="radio" name="trigger" value="${t}" ${t === trigger ? 'checked' : ''} required><span>${t}</span></label>`).join('')}</div></fieldset>`}
      <label class="field"><span>${first ? 'この問いが気になった理由（書かなくてもOK）' : 'わかったこと・わからなかったこと（書かなくてもOK）'}</span>
        <textarea name="note" rows="2" maxlength="600"></textarea></label>
      <fieldset class="field"><legend>問いのセルフチェック（あてはまるものに✓）</legend>
        ${CHECKS.map((c, i) => `<label class="cb"><input type="checkbox" name="c${i}" ${cur && cur.checks[i] && !first ? 'checked' : ''}><span>${esc(c.label)}</span></label>`).join('')}
      </fieldset>
      <div class="row end"><button type="button" class="btn ghost" data-act="close-dlg">やめる</button><button class="btn primary">保存する</button></div>
    </form>`;
  dlg.showModal();
  const ta = dlg.querySelector('textarea[name=q]');
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
}

async function submitUpdate(form) {
  const fd = new FormData(form);
  const q = String(fd.get('q') || '').trim();
  const cur = S.versions[S.versions.length - 1];
  if (!q) return toast('問いを書いてください。');
  if (cur && q === cur.question) return toast('問いがまだ変わっていません。少しでも書きかえてみよう。');
  const pm = pastMatches(q);
  if (pm.length && pm[0].level === 'same') { $('#pastCheck').innerHTML = pastCheckHtml(q); return toast('過去の Inspired100 の問いとほぼ同じです。自分だけの問いにしてから保存しよう。'); }
  form.classList.add('busy');
  try {
    const b = await api('student.addVersion', Object.assign(ident(), {
      question: q, trigger: cur ? fd.get('trigger') : 'はじめの問い', note: String(fd.get('note') || '').trim(),
      checks: CHECKS.map((c, i) => !!fd.get('c' + i)),
    }));
    setBundle(b);
    $('#dlg').close();
    S.view = 'note'; S.justUpdated = true;
    render();
    toast(cur ? '問いを更新しました。' : '最初の問いを書きました。');
  } catch (e) { toast(e.message); } finally { form.classList.remove('busy'); }
}

let saveTimer;
function saveFields(fields, now) {
  Object.assign(S.student, fields);
  clearTimeout(saveTimer);
  const run = async () => { try { const r = await api('student.save', Object.assign(ident(), { fields })); S.student = r.student; } catch (e) { toast(e.message); } };
  if (now) run(); else saveTimer = setTimeout(run, 900);
}

function viewChat() {
  const gem = CONFIG.GEM_URL ? `<p style="margin:.8rem 0"><a class="btn ghost small" href="${esc(CONFIG.GEM_URL)}" target="_blank" rel="noopener">Geminiの「問いの壁打ちGem」をひらく</a></p>` : '';

  const msgs = S.chat.length ? S.chat.map(m => m.role === 'user'
    ? `<div class="msg me">${esc(m.text)}</div>`
    : `<div class="msg coach${m.wait ? ' wait' : ''}"><span class="who2">問いのコーチ（AI）</span>${esc(m.text)}</div>`).join('')
    : `<div class="msg coach"><span class="who2">問いのコーチ（AI）</span>AIの問いのコーチです。答えは教えませんが、あなたが考えを深められるように質問します。気になっていることを、何でも書いてみてください。</div>`;
  return `
    <p class="fine">相手は人ではなく AI です。AIはまちがえることもあるので、大事なことは本や先生で確かめよう。やりとりは先生も見ることができます。名前・住所・連絡先などは書かないでください。つらいことがあるときは、AIではなく担任の先生や保健室に相談してください。今日あと<b>${S.aiLeft}</b>回</p>

    <div class="msgs" id="msgs">${msgs}</div>
    ${S.chat.length ? '' : `<div class="chips" style="margin-bottom:.8rem">${COACH_STARTERS.map(t => `<button type="button" class="chip" data-act="starter" data-text="${esc(t)}">${esc(t)}</button>`).join('')}</div>`}
    ${S.chat.length >= 2 ? '<p style="margin-bottom:.6rem"><button type="button" class="link" data-act="chat-to-update">この壁打ちをもとに、問いを更新する</button></p>' : ''}
    <form class="chat-form" id="chatForm"><textarea name="m" rows="2" maxlength="600" placeholder="例：部活のことで問いをつくりたい" aria-label="コーチへのメッセージ"></textarea><button class="btn primary">送る</button></form>`;
}

async function sendChat(text) {
  text = String(text || '').trim();
  if (!text || S.chatBusy) return;
  S.chatBusy = true;
  S.chat.push({ role: 'user', text });
  S.chat.push({ role: 'model', text: '考えています…', wait: true });
  render();
  try {
    const r = await api('student.chat', Object.assign(ident(), { messages: S.chat.filter(m => !m.wait).slice(-12) }));
    S.chat.pop(); S.chat.push({ role: 'model', text: r.reply }); S.aiLeft = r.aiLeft;
  } catch (e) {
    S.chat.pop(); S.chat.pop(); toast(e.message);
  } finally { S.chatBusy = false; render(); const ta = $('#chatForm textarea'); if (ta) ta.focus(); }
}

function viewProject() {

  let result = '';

      <p class="fine">5つの質問に答えると、近い部門の「めやす」がわかります（公式の審査の基準ではありません）。</p>
      <div class="diag">${DIAG.map((d, i) => `<div><p>${i + 1}. ${esc(d.q)}</p><div class="chips">${d.a.map((a, j) =>
        `<button type="button" class="chip" data-act="diag" data-i="${i}" data-j="${j}" aria-pressed="${S.diag[i] === j}">${esc(a)}</button>`).join('')}</div></div>`).join('')}</div>
      ${result || (answered ? `<p class="fine">あと${DIAG.length - answered}問です。</p>` : '')}

    </section>

      <label class="field"><span>プロジェクト名</span><input type="text" maxlength="80" data-proj="title" value="${esc(p.title || '')}" placeholder="例：府中のフェアトレードを高校生から"></label>

}

const T_PASS = 'tankyu_tpass', T_NAME = 'tankyu_tname';
const FLAG_LABEL = { noq: '問いがまだない', stale: '止まっている', weak: 'チェックが少ない', past: '受賞問いに近い', draft: 'AI下書きあり' };
const PM_CACHE = new Map();
const pmCached = q => { if (!PM_CACHE.has(q)) PM_CACHE.set(q, pastMatches(q, 2)); return PM_CACHE.get(q); };

async function teacherLoad() {
  const pass = sessionStorage.getItem(T_PASS);
  if (!pass) { S.teacher = null; return render(); }
  try {
    S.teacher = await api('teacher.data', { pass });
    render();
  } catch (e) { sessionStorage.removeItem(T_PASS); S.teacher = null; render(); toast(e.message); }
}

function tModel() {
  const d = S.teacher;
  const by = (arr, k) => arr.reduce((m, x) => ((m[x[k]] = m[x[k]] || []).push(x), m), {});
  const vBy = by(d.versions, 'key'), aBy = by(d.advice, 'key'), mBy = by(d.memos, 'key');
  return d.students.map(s => {
    const vs = (vBy[s.key] || []).sort((a, b) => a.v - b.v);
    const last = vs[vs.length - 1];
    const idle = daysSince(last ? last.at : s.created);
    const checks = last ? (last.checks || []).filter(Boolean).length : 0;
    const advice = (aBy[s.key] || []).sort((a, b) => a.created < b.created ? 1 : -1);
    const drafts = advice.filter(a => a.status === '下書き');
    const flags = [];
    if (!vs.length) flags.push('noq');
    else if (idle >= d.settings.staleDays) flags.push('stale');
    if (vs.length && checks <= 1) flags.push('weak');
    const past = s.question ? pmCached(s.question) : [];
    if (past.length && past[0].kind === 'form') flags.push('past');
    if (drafts.length) flags.push('draft');
    return { s, vs, last, idle, past, updates: Math.max(0, vs.length - 1), checks, flags, advice, drafts, memos: (mBy[s.key] || []).sort((a, b) => a.at < b.at ? 1 : -1) };
  });
}

function tFiltered(rows) {
  const f = S.tf;
  const q = f.q.trim();
  const out = rows.filter(r => (!f.cls || r.s.cls === f.cls)
    && (!f.cat || (f.cat === 'none' ? !r.s.category : r.s.category === f.cat))
    && (!f.step || r.s.step === f.step)
    && (!f.flag || r.flags.includes(f.flag))
    && (!f.interest || (r.s.interests || {})[f.interest])
    && (!q || (r.s.name + r.s.question + r.s.cls).includes(q)));
  const sorters = {
    num: (a, b) => a.s.cls.localeCompare(b.s.cls, 'ja') || a.s.num - b.s.num,
    idle: (a, b) => b.idle - a.idle,
    updates: (a, b) => b.updates - a.updates,
  };
  return out.sort(sorters[f.sort] || sorters.num);
}

function bars(items, filterKey) {
  const max = Math.max(1, ...items.map(i => i.n));
  return `<div class="bars">${items.map(i => {
    const tag = filterKey ? 'button' : 'div';
    const attrs = filterKey ? ` type="button" data-act="tfilter" data-k="${filterKey}" data-v="${esc(i.v)}" aria-pressed="${S.tf[filterKey] === i.v}"` : '';
    return `<${tag} class="bar-row"${attrs}><span>${esc(i.label)}</span><span class="bar-track"><i style="width:${i.n / max * 100}%;--c:${i.c || 'var(--board)'}"></i></span><span class="num">${i.n}</span></${tag}>`;
  }).join('')}</div>`;
}

  const head = ['クラス', '番号', '名前', 'いまの問い', '部門', 'ステップ', '更新回数', '最終更新', '関心', '状態'];
  const cell = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
  const lines = [head.map(cell).join(',')].concat(rows.map(r => [r.s.cls, r.s.num, r.s.name, r.s.question, r.s.category, r.s.step, r.updates,
    r.last ? md(r.last.at) : '', INTERESTS.filter(i => (r.s.interests || {})[i.id]).map(i => i.label).join('／'), r.flags.map(f => FLAG_LABEL[f]).join('／')].map(cell).join(',')));
  const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `探究ノート_問い一覧_${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}

async function tCall(action, payload, done) {
  try {
    const r = await api(action, Object.assign({ pass: sessionStorage.getItem(T_PASS), teacher: localStorage.getItem(T_NAME) || '先生' }, payload));
    if (done) done(r);
    const keep = S.tOpen;
    S.teacher = await api('teacher.data', { pass: sessionStorage.getItem(T_PASS) });
    render();
    if (keep && $('#drawer').open) openDrawer(keep);
    return r;
  } catch (e) { toast(e.message); }
}

/* ============================================================
   7. 操作
   ============================================================ */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act !== 't-sel' && el.tagName !== 'INPUT') e.preventDefault();
  switch (act) {
    case 'go': S.view = el.dataset.view; render(); window.scrollTo(0, 0); break;
    case 'logout': localStorage.removeItem(ME_KEY); S.me = null; S.student = null; S.chat = []; S.diag = {}; S.suggest = null; render(); break;
    case 'open-update': openUpdate(); break;
    case 'close-dlg': $('#dlg').close(); break;
    case 'set-step': saveFields({ step: el.dataset.step }, true); render(); break;
    case 'hint': S.hint = el.dataset.hint; render(); break;
    case 'use-seed': openUpdate(el.dataset.text, S.versions.length ? 'その他' : null); break;
    case 'interest': {
      const it = Object.assign({}, S.student.interests); it[el.dataset.id] = !it[el.dataset.id]; if (!it[el.dataset.id]) delete it[el.dataset.id];
      saveFields({ interests: it }, true); render();
      if (it[el.dataset.id]) toast('探究部の先生に伝わりました。'); break;
    }
    case 'starter': sendChat(el.dataset.text); break;
    case 'chat-to-update': openUpdate(null, 'AIと壁打ちした'); break;
    case 'advice-to-update': openUpdate(null, '先生のアドバイス'); break;
    case 'diag': S.diag[el.dataset.i] = Number(el.dataset.j); render(); break;
    case 'set-cat': { const c = el.dataset.cat; saveFields({ category: S.student.category === c ? '' : c }, true); render(); break; }
    case 'suggest-cat': {
      el.disabled = true; el.textContent = 'AIが考えています…';
      try { const r = await api('student.suggestCategory', ident()); S.suggest = r.suggestion; S.aiLeft = r.aiLeft; } catch (err) { toast(err.message); }
      render(); break;
    }
    case 'check-item': { const cl = Object.assign({}, S.student.checklist); cl[el.dataset.id] = el.checked; if (!el.checked) delete cl[el.dataset.id]; saveFields({ checklist: cl }, true); render(); break; }
    case 'teacher-open': S.mode = 'teacher'; teacherLoad(); break;
    case 'student-open': S.mode = 'student'; render(); break;
    case 't-refresh': toast('最新にしています…'); teacherLoad(); break;
    case 'tfilter': { const k = el.dataset.k; S.tf[k] = S.tf[k] === el.dataset.v ? '' : el.dataset.v; render(); break; }
    case 't-sel': e.stopPropagation(); if (el.checked) S.tSel.add(el.dataset.key); else S.tSel.delete(el.dataset.key); render(); break;
    case 't-selall': tFiltered(tModel()).forEach(r => S.tSel.add(r.s.key)); render(); break;
    case 't-selnone': S.tSel.clear(); render(); break;
    case 't-open': openDrawer(el.dataset.key); break;
    case 'close-drawer': $('#drawer').close(); S.tOpen = null; break;
    case 't-tpl': $('#d-text').value = ADVICE_TEMPLATES[el.dataset.i]; $('#d-text').focus(); break;
    case 'c-tpl': $('#composeForm textarea').value = ADVICE_TEMPLATES[el.dataset.i]; break;
    case 't-compose': openCompose(); break;
    case 't-send-one': {
      const text = $('#d-text').value.trim();
      if (!text) return toast('アドバイスを書いてください。');
      await tCall('teacher.send', { keys: [el.dataset.key], text }, () => toast('アドバイスを送りました。')); break;
    }
    case 't-aidraft': {
      el.disabled = true; el.textContent = '下書き中…';
      try { const r = await api('teacher.aiDraft', { pass: sessionStorage.getItem(T_PASS), key: el.dataset.key }); $('#d-text').value = r.text; } catch (err) { toast(err.message); }
      el.disabled = false; el.textContent = 'AIで下書き'; break;
    }
    case 't-memo': {
      const text = $('#d-memo').value.trim();
      if (!text) return toast('メモを書いてください。');
      await tCall('teacher.memo', { key: el.dataset.key, text }, () => toast('メモを残しました。')); break;
    }
    case 't-approve': {
      const text = $('#draft-' + el.dataset.id).value.trim();
      await tCall('teacher.approve', { id: el.dataset.id, text }, () => toast('アドバイスを送りました。')); break;
    }
    case 't-discard': await tCall('teacher.discard', { id: el.dataset.id }, () => toast('この下書きは送りません。')); break;
    case 't-runauto': await tCall('teacher.runAuto', {}, r => toast(`自動のアドバイスを${(r.auto && r.auto.sent) || 0}件送りました。`)); break;
    case 't-csv': exportCsv(); break;
    case 't-alldrafts': S.tAllDrafts = !S.tAllDrafts; render(); break;
    case 'past-f': S.pastF[el.dataset.k] = el.dataset.v; render(); break;
    case 'past-ai': S.hint = 'ai'; render(); sendChat(`過去の受賞問い「${el.dataset.q}」が気になっています。同じ問いにはできないので、自分だけの問いにするにはどうしたらいいですか？`); break;
  }
});

document.addEventListener('submit', async e => {
  const f = e.target;
  e.preventDefault();
  if (f.id === 'loginForm') login(f);
  else if (f.id === 'updForm') submitUpdate(f);
  else if (f.id === 'chatForm') { const t = f.m.value; f.m.value = ''; sendChat(t); }
  else if (f.id === 'teacherForm') {
    localStorage.setItem(T_NAME, f.tname.value.trim());
    sessionStorage.setItem(T_PASS, f.pass.value);
    teacherLoad();
  } else if (f.id === 'composeForm') {
    const text = f.text.value.trim();
    if (!text) return toast('本文を書いてください。');
    const keys = [...S.tSel];
    $('#dlg').close();
    await tCall('teacher.send', { keys, text }, r => { toast(`${r.sent}人にアドバイスを送りました。`); S.tSel.clear(); });
  }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.proj) { const p = Object.assign({}, S.student.project); p[el.dataset.proj] = el.value; saveFields({ project: p }); }
  if (el.matches('#updForm textarea[name=q]')) { clearTimeout(S.pcTimer); S.pcTimer = setTimeout(() => { const box = $('#pastCheck'); if (box) box.innerHTML = pastCheckHtml(el.value); }, 250); }
  if (el.dataset.pastQ !== undefined) { S.pastF.q = el.value.trim(); clearTimeout(S.pqTimer); S.pqTimer = setTimeout(() => { render(); const i = $('[data-past-q]'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 350); }
  if (el.dataset.tf === 'q') { S.tf.q = el.value; clearTimeout(S.tqTimer); S.tqTimer = setTimeout(() => { render(); const i = $('[data-tf="q"]'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 350); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.tf && el.dataset.tf !== 'q') { S.tf[el.dataset.tf] = el.value; render(); }
});
document.addEventListener('keydown', e => {
  if (e.target.matches('#chatForm textarea') && e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); e.target.form.requestSubmit(); }
});

/* ============================================================
   8. はじめに
   ============================================================ */
(async function boot() {
  if (location.hash === '#teacher') { S.mode = 'teacher'; return teacherLoad(); }
  let me = null;
  try { me = JSON.parse(localStorage.getItem(ME_KEY)); } catch (e) { me = null; }
  if (!me) return render();
  $('#app').innerHTML = '<div class="login"><p style="color:var(--chalk)">ノートをひらいています…</p></div>';
  try { const b = await api('student.login', me); S.me = me; setBundle(b); } catch (e) { localStorage.removeItem(ME_KEY); toast(e.message); }
  render();
})();
</script>
